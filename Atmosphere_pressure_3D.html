<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>催化劑參與反應動畫 | 元寶演示</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #f5f9ff 0%, #e3edfa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 54px;
            padding: 30px 40px 46px 40px;
            box-shadow: 0 25px 45px -10px rgba(0, 20, 60, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 920px;
            width: fit-content;
            text-align: center;
        }
        h2 {
            color: #1a3366;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 5px;
            margin-bottom: 18px;
            font-size: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h2 small {
            font-size: 16px;
            font-weight: 450;
            color: #3d5a80;
            background: rgba(59, 130, 246, 0.08);
            padding: 4px 16px;
            border-radius: 999px;
        }
        .canvas-wrapper {
            background: #ffffffdd;
            border-radius: 36px;
            padding: 20px 15px 15px 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.03), 0 12px 24px -12px rgba(0,35,70,0.2);
        }
        canvas {
            display: block;
            width: 790px;
            height: 330px;
            border-radius: 28px;
            background: radial-gradient(circle at 20% 30%, #f0f6fe, #d9e6f5);
            cursor: default;
            margin: 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            margin-top: 22px;
            font-size: 17px;
            color: #1e293b;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-dot {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .note {
            margin-top: 18px;
            color: #2a3f62;
            background: #ebf2fc;
            padding: 10px 24px;
            border-radius: 66px;
            font-size: 15px;
            display: inline-block;
            backdrop-filter: blur(2px);
            border: 1px solid #cddef5;
        }
        .btn-reset {
            background: white;
            border: none;
            padding: 8px 22px;
            border-radius: 90px;
            font-size: 15px;
            font-weight: 650;
            color: #1f3a6b;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 15px;
            border: 1px solid #bfd3ec;
        }
        .btn-reset:hover {
            background: #eaf1fd;
            transform: scale(0.97);
            box-shadow: 0 5px 12px rgba(33, 101, 196, 0.08);
        }
        .btn-reset:active {
            background: #d0e0f7;
        }
        @media (max-width: 830px) {
            .card { padding: 20px; border-radius: 32px; }
            canvas { width: 95%; height: auto; aspect-ratio: 790 / 325; }
        }
    </style>
</head>
<body>
<div class="card">
    <h2>
        ⚛️ 催化劑循環
        <small>參與反應 · 重新釋放</small>
    </h2>
    <div class="canvas-wrapper">
        <canvas id="reactionCanvas" width="890" height="365"></canvas>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="color-dot" style="background:#ff7260;"></span> 反應物 A</span>
        <span class="legend-item"><span class="color-dot" style="background:#44c767;"></span> 反應物 B</span>
        <span class="legend-item"><span class="color-dot" style="background:#3399ff;"></span> 催化劑 (Cat)</span>
        <span class="legend-item"><span class="color-dot" style="background:#cc88ff;"></span> 產物 AB</span>
        <button class="btn-reset" id="resetAnimationBtn">⟳ 重播動畫</button>
    </div>
    <div class="note">
        🧪 催化劑 (藍色) 與反應物結合 → 形成中間體 → 釋出催化劑<br><br>動畫製作 by 昱成自然</br>
    </div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('reactionCanvas');
        const ctx = canvas.getContext('2d');

        const W = 890, H = 365;

        /* ----- 初始位置常數 ----- */
        const INIT_A_X = 118, INIT_A_Y = 208;
        const INIT_B_X = 192, INIT_B_Y = 282;
        const INIT_CAT_X = 262, INIT_CAT_Y = 126;
        const INIT_AB_X = -300, INIT_AB_Y = -300;

        // 球體物件 (無 intermediate)
        const reactantA = { x: INIT_A_X, y: INIT_A_Y, r: 24, color: '#ff7260', label: 'A' };
        const reactantB = { x: INIT_B_X, y: INIT_B_Y, r: 23, color: '#44c767', label: 'B' };
        const catalyst  = { x: INIT_CAT_X, y: INIT_CAT_Y, r: 27, color: '#3399ff', label: 'Cat' };
        const productAB = { x: INIT_AB_X, y: INIT_AB_Y, r: 30, color: '#cc88ff', label: 'AB' };

        // 狀態
        let phase = 0;      // 0~4
        let progress = 0;   // 0~1

        /* ----- 完全重置 ----- */
        function fullReset() {
            phase = 0;
            progress = 0;

            reactantA.x = INIT_A_X; reactantA.y = INIT_A_Y; reactantA.r = 24;
            reactantB.x = INIT_B_X; reactantB.y = INIT_B_Y; reactantB.r = 23;
            catalyst.x = INIT_CAT_X; catalyst.y = INIT_CAT_Y; catalyst.r = 27;
            productAB.x = INIT_AB_X; productAB.y = INIT_AB_Y; productAB.r = 30;
        }

        /* ----- 繪製球體 (含光澤) ----- */
        function drawBall(b) {
            if (!b) return;
            if (b.x < -300 || b.x > W + 300 || b.y < -300 || b.y > H + 300) return;
            if (b.r <= 0.5) return;

            ctx.save();
            const grad = ctx.createRadialGradient(
                b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1,
                b.x, b.y, b.r
            );
            if (typeof b.color === 'string' && b.color.includes('rgba')) {
                grad.addColorStop(0, 'rgba(184, 219, 254, 0.8)');
                grad.addColorStop(0.7, b.color);
                grad.addColorStop(1, 'rgba(48, 104, 164, 0.5)');
            } else {
                grad.addColorStop(0, lightenColor(b.color, 53));
                grad.addColorStop(0.6, b.color);
                grad.addColorStop(1, darkenColor(b.color, 33));
            }
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.055)';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 高光
            ctx.beginPath();
            ctx.arc(b.x - b.r*0.25, b.y - b.r*0.3, b.r*0.18, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,245,0.5)';
            ctx.fill();

            // 標籤
            if (b.label && b.r > 14) {
                ctx.font = `bold ${Math.floor(b.r * 0.57)}px "Segoe UI", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.08)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffffffee';
                ctx.fillText(b.label, b.x, b.y+1);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(b.label, b.x, b.y+1);
            }
            ctx.restore();
        }

        function lightenColor(color, pct) {
            const num = parseInt(color.replace('#',''), 16);
            const amt = Math.round(2.55 * pct);
            const R = Math.min(255, (num>>16)+amt);
            const G = Math.min(255, ((num>>8)&0x00FF)+amt);
            const B = Math.min(255, (num&0x0000FF)+amt);
            return `rgb(${R},${G},${B})`;
        }
        function darkenColor(color, pct) {
            const num = parseInt(color.replace('#',''), 16);
            const amt = Math.round(2.55 * pct);
            const R = Math.max(0, (num>>16)-amt);
            const G = Math.max(0, ((num>>8)&0x00FF)-amt);
            const B = Math.max(0, (num&0x0000FF)-amt);
            return `rgb(${R},${G},${B})`;
        }

        function lerp(a, b, t) {
            return a + (b - a) * Math.min(Math.max(t, 0), 1);
        }

        /* ----- 場景更新 (無 intermediate) ----- */
        function updateScene() {
            // ---- phase 0 : 三球靠近中央 ----
            if (phase === 0) {
                const tx = 348, ty = 178;
                const t = progress;
                reactantA.x = lerp(INIT_A_X, tx - 34, t);
                reactantA.y = lerp(INIT_A_Y, ty + 46, t);
                reactantB.x = lerp(INIT_B_X, tx + 30, t);
                reactantB.y = lerp(INIT_B_Y, ty + 56, t);
                catalyst.x = lerp(INIT_CAT_X, tx + 8, t);
                catalyst.y = lerp(INIT_CAT_Y, ty - 34, t);
                reactantA.r = 24; reactantB.r = 23; catalyst.r = 27;
                productAB.x = -300; productAB.y = -300;

                if (progress >= 1) { phase = 1; progress = 0; }
            }
            // ---- phase 1 : 碰撞結合 (A+B+Cat 聚集，無中間體球) ----
            else if (phase === 1) {
                const cx = 418, cy = 176;
                const t = progress;
                // 三球往同一點靠近，但不出現中間體球
                reactantA.x = lerp(314, cx - 16, t);
                reactantA.y = lerp(224, cy + 12, t);
                reactantB.x = lerp(378, cx + 18, t);
                reactantB.y = lerp(234, cy + 16, t);
                catalyst.x = lerp(356, cx + 6, t);
                catalyst.y = lerp(144, cy - 10, t);

                // 仍然隱藏產物
                productAB.x = -300; productAB.y = -300;

                if (progress >= 1) { phase = 2; progress = 0; }
            }
            // ---- phase 2 : 震盪結合 (催化劑參與，但無 intermediate 球) ----
            else if (phase === 2) {
                const cx = 425, cy = 171;
                const t = progress;
                // 催化劑在中心附近震盪 (表示參與)
                catalyst.x = cx + 8 + Math.sin(t * 35) * 12;
                catalyst.y = cy - 7 + Math.cos(t * 47) * 10;
                catalyst.r = 16 + Math.sin(t * 53) * 4;

                // A, B 圍繞中心縮小 (融入)
                reactantA.x = cx - 20 + Math.sin(t*27)*9;
                reactantA.y = cy + 12 + Math.cos(t*33)*8;
                reactantA.r = 10 + Math.sin(t*23)*3;
                reactantB.x = cx + 22 + Math.cos(t*25)*10;
                reactantB.y = cy - 14 + Math.sin(t*39)*9;
                reactantB.r = 9 + Math.cos(t*31)*3;

                productAB.x = -300; productAB.y = -300;

                if (progress >= 1) { 
                    phase = 3; progress = 0; 
                    catalyst.r = 27;   // 恢復半徑準備彈出
                }
            }
            // ---- phase 3 : 釋放產物 & 催化劑 (A, B 消失) ----
            else if (phase === 3) {
                const t = progress;

                // 催化劑彈出
                catalyst.x = lerp(425, 605, t);
                catalyst.y = lerp(138, 74, t);
                catalyst.r = 27;

                // 產物 AB 出現並定位
                productAB.x = lerp(400, 235, t);
                productAB.y = lerp(175, 264, t);
                productAB.r = 26 + 18 * Math.sin(t * 13) * 0.4 + 9*t;

                // A, B 直接消失
                reactantA.x = -500; reactantA.y = -500; reactantA.r = 0;
                reactantB.x = -600; reactantB.y = -600; reactantB.r = 0;

                if (progress >= 1) { phase = 4; progress = 1; }
            }
            // ---- phase 4 : 完成狀態 ----
            else if (phase === 4) {
                catalyst.x = 630; catalyst.y = 62; catalyst.r = 27;
                productAB.x = 210; productAB.y = 274; productAB.r = 44;
                reactantA.x = -999; reactantA.y = -999; reactantA.r = 0;
                reactantB.x = -888; reactantB.y = -888; reactantB.r = 0;
            }
        }

        /* ----- 動畫迴圈 ----- */
        function animate() {
            if (phase < 4) {
                progress += 0.0075;
                if (progress > 1) progress = 1;
                updateScene();
            }

            ctx.clearRect(0, 0, W, H);

            // 極淡背景線
            ctx.save();
            ctx.globalAlpha = 0.056;
            ctx.strokeStyle = '#446688';
            ctx.lineWidth = 1.2;
            for (let i=0; i<7; i++) {
                ctx.beginPath();
                ctx.moveTo(50+i*135, 18);
                ctx.lineTo(20+i*122, H-30);
                ctx.stroke();
            }
            ctx.restore();

            // 繪製球 (無 intermediate)
            drawBall(reactantA);
            drawBall(reactantB);
            drawBall(catalyst);
            drawBall(productAB);

            // 底部階段文字
            ctx.save();
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = '#253d63';
            ctx.shadowColor = 'rgba(255,255,255,0.3)';
            ctx.shadowBlur = 8;
            let msg = '';
            if (phase===0) msg = '⚡ 反應物與催化劑接近';
            else if (phase===1) msg = '🔬 形成中間體 (催化劑參與)';
            else if (phase===2) msg = '🌀 中間體震盪 · 鍵結重組';
            else if (phase===3) msg = '✨ 產物生成 · 催化劑脫離';
            else if (phase===4) msg = '✅ 催化劑再生 · 循環完成';
            ctx.fillText(msg, W/2, H-12);
            ctx.restore();

            requestAnimationFrame(animate);
        }

        // 綁定重置按鈕
        document.getElementById('resetAnimationBtn').addEventListener('click', fullReset);
        canvas.addEventListener('dblclick', fullReset);

        // 啟動
        fullReset();
        animate();
    })();
</script>
</body>
</html>
