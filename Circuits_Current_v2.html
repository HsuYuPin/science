<title>1-1 電路配線模擬器 ｜ 串聯、並聯與電功率</title>
<style>
/* ── 共用主題（第一章教具）────────────────────────────────────
   深色投影友善版面：左舞台、右控制面板；手機改上圖下面板。
   每支教具只在自己的樣式區塊內補排版微調，不重複這份色彩設定。
   ─────────────────────────────────────────────────────────── */
:root {
  --bg: #04080f;
  --card: rgba(13, 23, 38, 0.92);
  --card-solid: #0d1726;
  --line: rgba(120, 170, 220, 0.16);
  --line-2: rgba(120, 170, 220, 0.3);
  --text: #e7f1ff;
  --muted: #8ea6c4;
  --dim: #6b829f;
  --cyan: #5fe0ff;
  --amber: #ffc46b;
  --green: #5ce6a5;
  --red: #ff7d7d;
  --magenta: #ff8fd0;
  --violet: #b39dff;
  --copper: #e08a5a;
  --zinc: #b9c4d0;
  --radius: 16px;
  --fs-1: 12.5px;
  --fs-2: 13.5px;
  --fs-3: 15px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

  -webkit-tap-highlight-color: transparent;
}

.shell {
  max-width: 1560px;
  margin: 0 auto;
  padding: 18px 18px 42px;
}

/* ── 頁首 ─────────────────────────────────────────────────── */
header.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.eyebrow {
  font-size: 11.5px;
  letter-spacing: 0.26em;
  color: var(--cyan);
  font-weight: 700;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.eyebrow::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 14px var(--cyan);
}

h1 {
  font-size: clamp(19px, 2.1vw, 27px);
  margin: 0;
  letter-spacing: 0.02em;
  font-weight: 700;
  display: inline-block;
  background: linear-gradient(90deg, #8fe8ff, #b8a8ff 55%, #ffc78f);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sub {
  margin: 7px 0 0;
  font-size: var(--fs-1);
  color: var(--muted);
  letter-spacing: 0.03em;
  line-height: 1.6;
}

.head-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}

/* ── 版面 ─────────────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  gap: 16px;
  align-items: start;
}

.stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(20, 36, 58, 0.55), rgba(8, 16, 28, 0.92));
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5), inset 0 0 70px rgba(60, 140, 255, 0.05);
  overflow: hidden;
  aspect-ratio: 900 / 560;
}

.stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
}

  margin: 0 0 11px;

  color: var(--muted);
  font-weight: 700;
}

  font-weight: 600;
  cursor: pointer;
  transition: 0.16s;
  white-space: nowrap;
  min-height: 38px;
}

.seg button:hover:not(:disabled) { color: var(--text); background: rgba(95, 224, 255, 0.09); }
.seg button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="eyebrow">第一章 電與生活 ｜ 1-1 電功率–電流熱效應</div>
      <h1>電路配線模擬器</h1>
      <p class="sub">拉動電阻、切換串並聯、燒壞一顆燈泡，看電壓、電流、功率怎麼分配。</p>
    </div>
    <div class="head-side">
      <span class="badge warn" id="stateBadge">通路</span>
      <span class="chip">講義 P.1–9</span>
    </div>
  </header>

  <div class="layout">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="串並聯電路模擬畫面"></canvas>
    </div>

    <div class="panel">
      <section class="card">
        <h2>電路布局</h2>
        <div class="seg">
          <button data-layout="series">全串聯</button>
          <button data-layout="parallel">全並聯</button>
        </div>
        <div class="seg">
          <button data-layout="aParBC">A∥(B＋C)</button>
          <button data-layout="aSerBC">A＋(B∥C)</button>
        </div>
      </section>

      <section class="card">
        <h2>電源與燈泡</h2>
        <div class="row">
          <div class="row-head"><span>電源電壓 V</span><b id="vVal">6 V</b></div>
          <input type="range" id="vRange" min="1" max="30" step="0.5" value="6" aria-label="電源電壓">
        </div>
        <div class="row">
          <div class="row-head"><span>燈泡 A 電阻 R<sub>A</sub></span><b id="raVal">3 Ω</b></div>
          <input type="range" id="raRange" min="0.2" max="30" step="0.1" value="3" aria-label="燈泡A電阻">
        </div>
        <div class="row">
          <div class="row-head"><span>燈泡 B 電阻 R<sub>B</sub></span><b id="rbVal">1 Ω</b></div>
          <input type="range" id="rbRange" min="0.2" max="30" step="0.1" value="1" aria-label="燈泡B電阻">
        </div>
        <div class="row">
          <div class="row-head"><span>燈泡 C 電阻 R<sub>C</sub></span><b id="rcVal">2 Ω</b></div>
          <input type="range" id="rcRange" min="0.2" max="30" step="0.1" value="2" aria-label="燈泡C電阻">
        </div>

          <label><input type="checkbox" data-blow="1">B 燒壞</label>

<script>
/* 數值與分數格式化：讓 6/11 Ω 這種答案以分數呈現，而不是 0.545454… */
(function (g) {
  const NS = (g.DSH1 = g.DSH1 || {});

  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) {
      const t = a % b;
      a = b;
      b = t;
    }
    return a || 1;
  }

  /** 以連分數逼近 x，回傳 {n, d} 或 null。 */
  function frac(x, maxDen = 9999, tol = 1e-9) {
    if (!Number.isFinite(x) || Math.abs(x) > 1e9) return null;
    const neg = x < 0;
    const v = Math.abs(x);
    let h1 = 1;
    let h0 = 0;
    let k1 = 0;
    let k0 = 1;
    let b = v;
    for (let i = 0; i < 32; i += 1) {
      const a = Math.floor(b);
      const h2 = a * h1 + h0;
      const k2 = a * k1 + k0;
      h0 = h1;
      h1 = h2;
      k0 = k1;
      k1 = k2;
      if (k1 > maxDen) return null;
      if (k1 > 0 && Math.abs(v - h1 / k1) <= tol * Math.max(1, v)) {
        return { n: neg ? -h1 : h1, d: k1 };
      }
      const rest = b - a;
      if (rest < 1e-12) break;
      b = 1 / rest;
      if (!Number.isFinite(b)) break;
    }
    return null;
  }

  /** 一般數字：固定小數再去除多餘 0（整數不會被切掉尾端的 0）。 */
  function num(x, digits = 2) {
    if (!Number.isFinite(x)) return '—';
    if (Math.abs(x) >= 1e6) return x.toExponential(2);
    let s = x.toFixed(digits);
    if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }

  /** 電阻：優先分數（分母 ≤ 3 位數），否則小數。回傳 {text, sub}。 */
  function res(x) {
    if (!Number.isFinite(x)) return { text: '∞', sub: '斷路' };
    const f = frac(x);
    if (f && f.d !== 1 && f.d <= 999 && Math.abs(f.n) <= 9999) {
      return { text: `${f.n}/${f.d}`, sub: `${num(x, 3)}` };
    }
    return { text: num(x, 2), sub: '' };
  }

  /** 將一串數值化成最簡整數比，例如 [3,2,1] → "3 : 2 : 1"；失敗回 null。 */
  function ratio(values) {
    const pos = values.filter((v) => v > 1e-9);
    if (pos.length < 2) return null;
    const base = Math.min(...pos);
    const rel = values.map((v) => v / base);
    for (let s = 1; s <= 30; s += 1) {
      const scaled = rel.map((v) => v * s);
      if (scaled.every((v) => Math.abs(v - Math.round(v)) < 0.04)) {
        return scaled.map((v) => Math.round(v));
      }
    }
    return null;
  }

  function ratioText(values) {
    const r = ratio(values);
    return r ? r.join(' : ') : '—';
  }

  NS.fmt = { gcd, frac, num, res, ratio, ratioText };
})(globalThis);

/* 電路核心：以節點電壓法（MNA）真正求解，支援串聯、並聯與兩種混聯拓樸，
   也支援「燈泡燒壞（R→∞）」與短路，不靠人工公式拼答案。 */
(function (g) {
  const NS = (g.DSH1 = g.DSH1 || {});

  // 節點編號：srcP 為電池正極、srcN 為電池負極（接地）。
  const TOPO = {
    series: {
      label: '全串聯',
      nodes: 4,
      srcP: 0,
      srcN: 3,
      branches: [
        { lamp: 0, a: 0, b: 1 },
        { lamp: 1, a: 1, b: 2 },
        { lamp: 2, a: 2, b: 3 },
      ],
    },
    parallel: {
      label: '全並聯',
      nodes: 2,
      srcP: 0,
      srcN: 1,
      branches: [
        { lamp: 0, a: 0, b: 1 },
        { lamp: 1, a: 0, b: 1 },
        { lamp: 2, a: 0, b: 1 },
      ],
    },
    aParBC: {
      label: 'A∥(B＋C)',
      nodes: 3,
      srcP: 0,
      srcN: 1,
      branches: [
        { lamp: 0, a: 0, b: 1 },
        { lamp: 1, a: 0, b: 2 },
        { lamp: 2, a: 2, b: 1 },
      ],
    },
    aSerBC: {
      label: 'A＋(B∥C)',
      nodes: 3,
      srcP: 0,
      srcN: 2,
      branches: [
        { lamp: 0, a: 0, b: 1 },
        { lamp: 1, a: 1, b: 2 },
        { lamp: 2, a: 1, b: 2 },
      ],
    },
  };

  function solveLinear(G, rhs) {
    const n = rhs.length;
    const a = G.map((row, i) => row.concat([rhs[i]]));
    for (let c = 0; c < n; c += 1) {

      // 電流越大 → 亮點越密、跑得越快
      const dense = S < 0.75 ? 1 / S : 1; // 小畫面時把亮點間距換算成固定螢幕距離，避免擠成一團
      const spacing = Math.min(140, Math.min(112, Math.max(34, 148 / cur)) * dense);
      const speed = 26 + 30 * Math.sqrt(Math.min(12, cur));
      const off = (phase * speed) % spacing;
      ctx.save();
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = px(8);
      }
      ctx.fillStyle = color;
      for (let d = off; d < len - 6; d += spacing) {
        const p = pathPoint(route.pts, d);
        ctx.beginPath();
        ctx.arc(p.x, p.y, px(2.4), 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  // 電池周圍的柔光遮罩：讓亮點看起來是「從電池內部冒出來」
  function drawBatteryHalo(x, y) {
    const g = ctx.createRadialGradient(x, y, 6, x, y, 54);
    g.addColorStop(0, 'rgba(8, 17, 28, 0.97)');
    g.addColorStop(0.62, 'rgba(8, 17, 28, 0.9)');
    g.addColorStop(1, 'rgba(8, 17, 28, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 54, 0, TAU);
    ctx.fill();
  }

  function drawScaleLabels(geom) {
    if (S < 0.5) return;
    text(`總電壓 V總 = ${fmt.num(state.V, 2)} V`, 872, 542, {
      size: 16,
      color: '#a9c0da',
      mono: true,
      align: 'right',
    });
    if (result.open) {
      text('斷路：沒有電流', 46, 34, { size: 18, color: '#ff9d9d', align: 'left' });
      return;
    }
    // 電流顏色圖例：每條支路一種顏色，數字就是該支路電流
    text('電流（亮點顏色＝各支路）', 46, 16, {
      size: 13,
      color: 'rgba(160, 190, 220, .85)',
      align: 'left',
    });
    geom.routes.forEach((route, i) => {
      const x = 46 + i * 205;
      const y = 44;
      const color = ROUTE_COLORS[route.color];
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = px(10);
      dot(x, y, px(4.6), color);
      ctx.restore();
      text(`${route.label}  ${fmt.num(routeCurrent(route), 2)} A`, x + 14, y, {
        size: 17,
        color: '#dceaf8',
        align: 'left',
        mono: true,
        weight: 600,
      });
    });
  }

  // ── 主繪製 ─────────────────────────────────────────────────
  let phase = 0;
  let last = performance.now();

  function draw(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    phase += dt;

    ctx.clearRect(0, 0, W, H);

    // 標題浮水印
    ctx.save();
    ctx.translate((W - 900 * S) / 2, (H - 560 * S) / 2);
    ctx.scale(S, S);

    const geom = GEO[state.layout];
    const isMixed = state.layout === 'aParBC' || state.layout === 'aSerBC';

    // 導線
    geom.wires.forEach((w) => poly(w, 'rgba(123,162,204,.85)', px(3.2)));

    // 接點
    polygonJunctions(geom, isMixed);

    // 電流亮點（由電池＋極出發、分流、回到−極）
    drawCurrent(geom, phase);

    // 電池本體畫在亮點之上，看起來像「從電池內部流出來」
    drawBatteryHalo(geom.battery.x, geom.battery.y);
    drawBattery(geom.battery.x, geom.battery.y, state.V, phase);

    // 燈泡
    for (let i = 0; i < 3; i += 1) drawLamp(geom.lamps[i], i, result.lamps[i], geom, phase);

    drawScaleLabels(geom);
    ctx.restore();

    requestAnimationFrame(draw);
  }

  function polygonJunctions(geom, isMixed) {
    if (state.layout === 'series') return;
    if (state.layout === 'parallel') {
      [190, 290, 390].forEach((y) => {
        drawJunction(210, y);
        drawJunction(690, y);
      });
      return;
    }
    if (state.layout === 'aParBC') {
      drawJunction(180, 250);
      drawJunction(720, 250);
      drawJunction(180, 370);
      drawJunction(720, 370);
      return;
    }
    if (state.layout === 'aSerBC') {
      drawJunction(580, 210);
      drawJunction(580, 470);
      drawJunction(690, 210);
      drawJunction(690, 470);
    }
  }

  // 絕對亮度：只由該燈泡自己的功率決定，與其他燈泡無關（燒壞最亮的那顆，其他不變亮）。
  // 用 0.6 次方 + 固定底光，讓 1 W～50 W 之間都分辨得出來，不再全部壓在 20 W 以上。
  function brightnessOf(P) {
    if (!(P > 0)) return 0;
    const t = Math.pow(Math.min(P, 60) / 50, 0.6);
    return Math.min(1, 0.14 + 0.86 * t);
  }

  // ── 面板更新 ───────────────────────────────────────────────
  function updateReadout() {
    const Req = result.Req;
    const rq = fmt.res(Req);
    const ptot = result.lamps.reduce((s, l) => s + l.P, 0);

    $('readout').innerHTML = `
      <span>總電阻 R<sub>總</sub></span><b>${rq.text}${rq.sub ? ` <span style="color:#6b829f">(${rq.sub})</span>` : ''} Ω</b>
      <span>總電流 I<sub>總</sub></span><b>${fmt.num(result.Itot, 3)} A</b>
      <span>總電功率 P<sub>總</sub></span><b>${fmt.num(ptot, 2)} W</b>
      <span>電源電壓 V</span><b>${fmt.num(state.V, 2)} V</b>
    `;

    const rows = ['A', 'B', 'C'].map((name, i) => {
      const l = result.lamps[i];
      const b = Math.round(100 * brightnessOf(l.P));
      const off = !l.on || state.blown[i];
      return `<tr class="${off ? 'off' : ''}">
        <td>${name}</td>
        <td>${fmt.num(state.R[i], 2)}</td>
        <td>${fmt.num(l.V, 2)}</td>
        <td>${fmt.num(l.I, 2)}</td>
        <td>${fmt.num(l.P, 2)}</td>
        <td>${off ? '熄' : `${b}%`}</td>
      </tr>`;
    });
    $('lampTable').innerHTML = `
      <thead><tr><th>燈泡</th><th>R(Ω)</th><th>V(V)</th><th>I(A)</th><th>P(W)</th><th>亮度</th></tr></thead>
      <tbody>${rows.join('')}</tbody>`;

    $('stateBadge').textContent = result.open ? '斷路' : '通路';
    $('stateBadge').className = `badge ${result.open ? 'danger' : 'ok'}`;
  }

  function syncControls() {
    document.querySelectorAll('[data-layout]').forEach((b) => {
      b.classList.toggle('active', b.dataset.layout === state.layout);
    });
    $('vRange').value = String(state.V);
    $('vVal').textContent = `${fmt.num(state.V, 1)} V`;
    const ids = ['ra', 'rb', 'rc'];
    state.R.forEach((r, i) => {
      $(`${ids[i]}Range`).value = String(r);
      $(`${ids[i]}Val`).textContent = `${fmt.num(r, 2)} Ω`;
    });
    document.querySelectorAll('[data-blow]').forEach((el) => {
      el.checked = state.blown[Number(el.dataset.blow)];
    });
  }

  function recompute() {
    result = solve(state.layout, state.R, state.blown, state.V);
    updateReadout();
  }

  // ── 事件 ──────────────────────────────────────────────────
  document.querySelectorAll('[data-layout]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.layout = btn.dataset.layout;
      syncControls();
      recompute();
    });
  });

  // 保留給自動測試與課前準備使用，畫面上不放範例按鈕
  function applyPreset(id) {
    const p = PRESETS.find((x) => x.id === id);
    if (!p) return;
    state.layout = p.layout;
    state.V = p.V;
    state.R = p.R.slice();
    state.blown = p.blown.slice();
    syncControls();
    recompute();
  }

  $('vRange').addEventListener('input', (e) => {
    state.V = Number(e.target.value);
    $('vVal').textContent = `${fmt.num(state.V, 1)} V`;
    recompute();
  });

  ['ra', 'rb', 'rc'].forEach((key, i) => {
    $(`${key}Range`).addEventListener('input', (e) => {
      state.R[i] = Number(e.target.value);
      $(`${key}Val`).textContent = `${fmt.num(state.R[i], 2)} Ω`;
      syncControls();
      recompute();
    });
  });

  document.querySelectorAll('[data-blow]').forEach((el) => {
    el.addEventListener('change', () => {
      const i = Number(el.dataset.blow);
      state.blown[i] = el.checked;
      recompute();
    });
  });
  window.addEventListener('resize', resize);

  // ── 啟動 ──────────────────────────────────────────────────
  resize();
  syncControls();
  recompute();
  requestAnimationFrame(draw);

  // 印刷/投影用：把舞台尺寸固定為 900×560 的邏輯座標
  window.__APP_READY__ = true;
  window.__MODEL__ = {
    getState() {
      const ptot = result.lamps.reduce((s, l) => s + l.P, 0);
      return {
        layout: state.layout,
        V: state.V,
        R: state.R.slice(),
        blown: state.blown.slice(),
        Itot: result.Itot,
        Req: Number.isFinite(result.Req) ? result.Req : null,
        ReqFraction: fmt.res(result.Req),
        Ptot: ptot,
        open: result.open,
        lamps: result.lamps.map((l) => ({ V: l.V, I: l.I, P: l.P, on: l.on })),
        preset: state.preset,
      };
    },
    set(patch) {
      if (patch.layout) state.layout = patch.layout;
      if (typeof patch.V === 'number') state.V = patch.V;
      if (patch.R) state.R = patch.R.slice();
      if (patch.blown) state.blown = patch.blown.slice();
      if (!('preset' in patch)) state.preset = null;
      syncControls();
      recompute();
      return this.getState();
    },
    loadPreset: applyPreset,
    presets: PRESETS.map((p) => p.id),
  };
})();
</script>
</body>
</html>
