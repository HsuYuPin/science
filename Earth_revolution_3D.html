<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>地球公轉與四季變化</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060c;}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;

  canvas{display:block;touch-action:none;}

  #stage{position:fixed;inset:0;overflow:visible;z-index:1;}
  #stage > canvas{width:100%;height:100%;display:block;}

  #title{position:fixed;top:18px;left:22px;pointer-events:none;z-index:12;}
  #title h1{

  }
  #title p{margin:6px 0 0;font-size:12px;color:#6d87ab;letter-spacing:.5px;}

  #mobileTools{
    position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:22;
  }
  #mobileTools button{
    background:rgba(20,40,70,.72);
    border:1px solid rgba(90,150,230,.5);
    color:#cfe3ff;font-size:12px;padding:7px 12px;border-radius:8px;
    cursor:pointer;font-family:inherit;white-space:nowrap;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:.18s;

  #mobileTools button:hover{background:rgba(50,100,170,.82);}
  #mobileTools button:active{transform:scale(.96);}

  #infoBox{
    position:fixed;top:66px;right:14px;width:268px;max-width:calc(100vw - 28px);
    background:rgba(8,18,34,.95);
    border:1px solid rgba(110,170,240,.45);
    border-radius:12px;padding:14px 16px;
    font-size:12.5px;line-height:1.75;color:#cfe0f5;
    z-index:25;opacity:0;transform:translateY(-10px);
    pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #infoBox.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .ib-title{

  button{

<body>

  <div id="mobileTools">

  <div id="stage"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"

<script type="module">
import * as THREE from 'three';

/* ==================== 參數 ==================== */
const ORBIT_R      = 34;
const EARTH_R      = 1.7;
const SUN_R        = 3.4;
const AXIAL_TILT   = THREE.MathUtils.degToRad(23.44);

const SUN_OFFSET   = new THREE.Vector3(0.9, 0, 0);

const ORBIT_PERIOD = 120;
const SPIN_RATIO   = 365 / 3;
const SPIN_PERIOD  = ORBIT_PERIOD / SPIN_RATIO;

// 太陽自轉週期（視覺用，約 25 秒一圈）
const SUN_SPIN_PERIOD = 25;

// 黃道面透明度（初始值）
const ECLIPTIC_BASE_OPACITY = 0.06;
const GRID_BASE_OPACITY     = 0.25;
const ECLIPTIC_BASE_PERCENT = 6;   // 對應滑桿初始值 6%

const GLOBAL_CAM_POS    = new THREE.Vector3(0, 45, 65);
const GLOBAL_CAM_TARGET = new THREE.Vector3(0, 0, 0);
const BASE_CAM_DIR      = new THREE.Vector3(0, 45, 65);

const EARTH_CAM_DIST    = EARTH_R * 5.5;
const TRANS_DUR         = 1.1;

/* ==================== 狀態變數 ==================== */
let viewMode      = 'global';
let transitioning = false;
let userInteracted = false;

/* 轉場完成後的回呼（用於兩階段轉場） */
let onTransitionComplete = null;

/* ==================== 舞台 & 渲染器 ==================== */
const stage = document.getElementById('stage');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 4000);
camera.position.copy(GLOBAL_CAM_POS);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.insertBefore(renderer.domElement, stage.firstChild);

/* ==================== 自訂軌道控制 ==================== */
class SimpleOrbit {
  constructor(camera, dom) {
    this.camera = camera;
    this.dom = dom;
    this.target = new THREE.Vector3();
    this.minDistance = 3;
    this.maxDistance = 400;
    this.rotateSpeed = 1.0;
    this.zoomSpeed = 1.0;
    this.damping = 0.12;
    this.onUserInteract = null;

    this._sph = new THREE.Spherical();
    this._dTheta = 0;
    this._dPhi = 0;
    this._scale = 1;

    this._dragging = false;
    this._px = 0;
    this._py = 0;
    this._touchDist = 0;

    const el = dom;
    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      this._dragging = true;
      this._px = e.clientX;
      this._py = e.clientY;
      if (this.onUserInteract) this.onUserInteract();
    });
    
    window.addEventListener('pointermove', e => {
      if (!this._dragging) return;
      let dx = e.clientX - this._px;
      let dy = e.clientY - this._py;
      this._px = e.clientX;
      this._py = e.clientY;

      const rect = this.dom.getBoundingClientRect();
      const W = rect.width || 1;
      const H = rect.height || 1;

      const speedFactor = (e.pointerType === 'touch') ? 0.4 : 1.0;

      this._dTheta -= 2 * Math.PI * dx / W * this.rotateSpeed * speedFactor;
      this._dPhi   -= 2 * Math.PI * dy / H * this.rotateSpeed * speedFactor;
    });
    window.addEventListener('pointerup', () => { this._dragging = false; });

    el.addEventListener('wheel', e => {
      e.preventDefault();
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 16;
      else if (e.deltaMode === 2) d *= 100;
      const f = Math.pow(0.95, this.zoomSpeed);
      this._scale *= d > 0 ? f : 1 / f;
      if (this.onUserInteract) this.onUserInteract();
    }, { passive: false });

    el.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        this._touchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (this.onUserInteract) this.onUserInteract();
      }
    }, { passive: false });

    el.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (this._touchDist > 0) this._scale *= this._touchDist / d;
        this._touchDist = d;
      }
    }, { passive: false });

    el.addEventListener('touchend', () => { this._touchDist = 0; });

    this.syncFromCamera();
  }

  syncFromCamera() {
    const off = new THREE.Vector3().subVectors(this.camera.position, this.target);
    this._sph.setFromVector3(off);
  }

  update() {
    const off = new THREE.Vector3().subVectors(this.camera.position, this.target);
    this._sph.setFromVector3(off);

    this._sph.theta += this._dTheta;
    this._sph.phi   += this._dPhi;
    this._sph.phi = Math.max(0.03, Math.min(Math.PI - 0.03, this._sph.phi));

    this._dTheta *= (1 - this.damping);
    this._dPhi   *= (1 - this.damping);

    this._sph.radius *= this._scale;
    this._sph.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this._sph.radius));
    this._scale = 1 + (this._scale - 1) * (1 - this.damping);

    off.setFromSpherical(this._sph);
    this.camera.position.copy(this.target).add(off);
    this.camera.lookAt(this.target);
  }
}

const orbit = new SimpleOrbit(camera, renderer.domElement);
orbit.target.copy(GLOBAL_CAM_TARGET);
orbit.syncFromCamera();

orbit.onUserInteract = () => {
  if (viewMode === 'earth') {
    userInteracted = true;
  }
};

/* ==================== 星空 ==================== */
(function buildStars() {
  const COUNT = 3500;
  const pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r  = 420 + Math.random() * 700;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffffff, size: 1.6, sizeAttenuation: true,
    transparent: true, opacity: 0.85, depthWrite: false
  })));
})();

/* ==================== 太陽（程序化表面著色器） ==================== */
const sunUniforms = { uTime: { value: 0 } };

const sunMaterial = new THREE.ShaderMaterial({
  uniforms: sunUniforms,
  vertexShader: /* glsl */`
    varying vec3 vLocalPos;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPos;

    void main() {
      vLocalPos    = position;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      vec4 wp      = modelMatrix * vec4(position, 1.0);
      vWorldPos    = wp.xyz;
      gl_Position  = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;

    varying vec3 vLocalPos;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPos;

    float hash31(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.11, 0.17, 0.13));
      p *= 17.0;
      return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }

    float noise3(vec3 x) {
      vec3 i = floor(x);
      vec3 f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(hash31(i + vec3(0.0, 0.0, 0.0)), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),
            mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
        mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),
            mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y),
        f.z);
    }

    float fbm3(vec3 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * noise3(p);
        p *= 2.03;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3  dir = normalize(vLocalPos);
      float t   = uTime * 0.05;

      float n1   = fbm3(dir * 3.5  + vec3(t, t * 0.6, -t * 0.4));
      float n2   = fbm3(dir * 9.0  - vec3(t * 1.4, 0.0, t * 0.9));
      float gran = fbm3(dir * 26.0 + n2 * 1.2);

      float bright = 0.72 + 0.28 * smoothstep(0.30, 0.80, gran);
      bright += 0.22 * (smoothstep(0.35, 0.85, n1) - 0.5);
      bright += 0.10 * (smoothstep(0.40, 0.90, n2) - 0.5);

      float spotField = fbm3(dir * 2.2 + 11.3);
      float spot = smoothstep(0.60, 0.70, spotField) * smoothstep(0.45, 0.75, n1);
      bright *= 1.0 - spot * 0.65;

      vec3  N    = normalize(vWorldNormal);
      vec3  V    = normalize(cameraPosition - vWorldPos);
      float mu   = clamp(dot(N, V), 0.0, 1.0);
      float limb = pow(mu, 0.55);

      vec3 coreCol = vec3(1.00, 0.94, 0.80);
      vec3 edgeCol = vec3(1.00, 0.46, 0.11);
      vec3 col = mix(edgeCol, coreCol, limb);
      col *= bright * 1.35;

      col = mix(col, vec3(1.00, 0.32, 0.05), pow(1.0 - mu, 3.0) * 0.55);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(SUN_R, 96, 64),
  sunMaterial
);
sun.position.copy(SUN_OFFSET);

sun.onBeforeRender = () => {
  sunUniforms.uTime.value = (performance.now() * 0.001) % 500;
};

scene.add(sun);

/* ==================== 太陽外圍柔光暈 ==================== */
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.00, 'rgba(255,245,205,1)');
  g.addColorStop(0.18, 'rgba(255,205,95,0.55)');
  g.addColorStop(0.45, 'rgba(255,150,40,0.18)');
  g.addColorStop(1.00, 'rgba(255,120,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(), blending: THREE.AdditiveBlending,
  transparent: true, depthWrite: false
}));
glow.scale.set(26, 26, 1);
glow.position.copy(SUN_OFFSET);
scene.add(glow);

/* ==================== 光源 ==================== */
const sunLight = new THREE.PointLight(0xfff4e0, 3.8, 0, 0);
sunLight.position.copy(SUN_OFFSET);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x152233, 0.15)); 

/* ==================== 黃道面 ==================== */
const eclipticDisk = new THREE.Mesh(
  new THREE.CircleGeometry(ORBIT_R + 7, 96),
  new THREE.MeshBasicMaterial({
    color: 0x3a74c4, transparent: true, opacity: ECLIPTIC_BASE_OPACITY,
    side: THREE.DoubleSide, depthWrite: false
  })
);
eclipticDisk.rotation.x = -Math.PI / 2;
eclipticDisk.position.y = -0.02;
scene.add(eclipticDisk);

const grid = new THREE.PolarGridHelper(ORBIT_R + 7, 12, 4, 96, 0x2f5c96, 0x24456e);
grid.material.transparent = true;
grid.material.opacity = GRID_BASE_OPACITY; 
scene.add(grid);

function applyEclipticOpacity(percent) {
  const f = percent / 100;
  eclipticDisk.material.opacity = f;
  grid.material.opacity = Math.min(f * (GRID_BASE_OPACITY / ECLIPTIC_BASE_OPACITY), 1.0);
}

(function buildOrbitLine() {
  const pts = [];
  for (let i = 0; i <= 240; i++) {
    const a = (i / 240) * Math.PI * 2;
    pts.push(new THREE.Vector3(ORBIT_R * Math.cos(a), 0, -ORBIT_R * Math.sin(a)));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({
    color: 0x5aa0f0, transparent: true, opacity: 0.65
  })));
})();

/* ==================== 地球貼圖 ==================== */
function makeEarthTexture() {
  const W = 4096, H = 2048;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  const X = lon => ((lon + 180) / 360) * W;
  const Y = lat => ((90 - lat) / 180) * H;

  /* ---------- 1. 海洋 ---------- */
  const og = ctx.createLinearGradient(0, 0, 0, H);
  og.addColorStop(0.00, '#061428');
  og.addColorStop(0.16, '#0a2648');
  og.addColorStop(0.34, '#0d3867');
  og.addColorStop(0.50, '#104880');
  og.addColorStop(0.66, '#0d3867');
  og.addColorStop(0.84, '#0a2648');
  og.addColorStop(1.00, '#061428');
  ctx.fillStyle = og;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 3000; i++) {
    const r = Math.random() * 70 + 20;
    ctx.fillStyle = `rgba(110,180,255,${Math.random() * 0.022})`;
    ctx.beginPath();
    ctx.arc(Math.random() * W, Math.random() * H, r, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------- 2. 陸地輪廓資料（經度, 緯度） ---------- */
  const LANDS = [
    [
      [-168,66],[-164,60],[-152,58],[-140,60],[-130,54],[-124,48],[-124,40],
      [-117,32],[-110,25],[-104,20],[-99,16],[-92,14],[-87,13],[-82,9],[-78,8],
      [-80,12],[-85,15],[-88,17],[-88,21],[-91,22],[-95,19],[-97,22],[-97,26],
      [-91,29],[-84,30],[-82,25],[-80,28],[-80,32],[-75,35],[-70,42],[-66,45],
      [-60,47],[-55,52],[-64,60],[-78,62],[-95,68],[-125,70],[-140,70],[-158,71]
    ],
    [
      [-78,8],[-79,2],[-80,-3],[-81,-6],[-77,-12],[-71,-18],[-70,-23],[-71,-30],
      [-73,-37],[-74,-44],[-75,-50],[-70,-55],[-66,-55],[-63,-49],[-62,-41],
      [-57,-37],[-53,-34],[-48,-26],[-40,-21],[-38,-13],[-35,-7],[-42,-2],
      [-50,0],[-51,4],[-60,8],[-68,11],[-75,10]
    ],
    [
      [-17,15],[-17,21],[-12,29],[-6,35],[0,36],[10,37],[20,32],[30,31],[34,28],
      [35,22],[38,17],[43,12],[48,12],[51,11],[45,3],[42,-2],[40,-10],[35,-19],
      [33,-26],[28,-33],[20,-35],[16,-29],[12,-18],[9,-2],[3,5],[-5,5],[-10,7],[-14,11]
    ],
    [
      [-9,37],[-9,43],[-1,44],[-1,48],[-4,49],[2,51],[7,54],[6,58],[5,62],
      [12,65],[18,69],[28,70],[40,68],[55,70],[70,72],[85,75],[100,76],[115,76],
      [130,73],[145,72],[160,70],[172,67],[180,65],[178,63],[170,60],[163,58],
      [155,52],[148,46],[142,46],[135,44],[130,42],[128,38],[122,35],[120,30],
      [122,25],[112,20],[108,15],[105,10],[103,1],[100,6],[98,12],[94,17],
      [90,22],[87,21],[82,17],[80,13],[77,8],[73,17],[70,22],[68,24],[63,25],
      [58,25],[57,22],[52,17],[48,13],[43,13],[38,17],[35,22],[33,28],[34,31],
      [36,36],[30,36],[27,37],[23,38],[19,40],[16,42],[13,45],[8,44],[3,43],[-2,37],[-6,36]
    ],
    [
      [-180,-70],[-150,-72],[-120,-73],[-90,-72],[-60,-68],[-30,-70],[0,-70],
      [30,-68],[60,-66],[90,-66],[120,-66],[150,-68],[180,-70],
      [180,-90],[-180,-90]
    ],
    [[-45,83],[-20,80],[-22,70],[-42,60],[-55,62],[-58,70],[-50,78]],
    [
      [114,-22],[113,-26],[115,-34],[120,-34],[129,-32],[137,-35],[141,-38],
      [147,-38],[150,-37],[153,-28],[146,-19],[142,-11],[136,-12],[130,-11],
      [126,-14],[122,-17]
    ],
    [[44,-16],[50,-15],[50,-25],[45,-25],[43,-20]],
    [[131,-1],[141,-3],[150,-6],[147,-9],[138,-9],[132,-4]],
    [[109,2],[117,4],[119,-1],[116,-4],[110,-3],[108,0]],
    [[95,5],[105,-6],[103,-6],[95,3]],
    [[105,-6],[114,-8],[114,-9],[105,-7]],
    [[119,1],[125,1],[125,-5],[120,-5],[118,-2]],
    [[120,18],[124,18],[126,10],[122,6],[120,12]],
    [[130,32],[135,35],[140,40],[142,44],[145,44],[142,38],[138,35],[133,33]],
    [[173,-35],[178,-38],[174,-41],[172,-44],[167,-46],[166,-45],[170,-42]],
    [[-5,58],[-2,58],[0,53],[1,51],[-5,50],[-6,54]],
    [[-10,54],[-6,55],[-6,52],[-10,52]],
    [[-24,66],[-14,66],[-14,64],[-24,64]],
    [[80,10],[82,8],[81,6],[80,7]],
    [[-84,22],[-77,23],[-74,20],[-80,21]]
  ];

  const landPath = new Path2D();
  LANDS.forEach(pts => {
    const P = pts.map(([lon, lat]) => [X(lon), Y(lat)]);
    const n = P.length;
    landPath.moveTo((P[n-1][0] + P[0][0]) / 2, (P[n-1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) {
      const a = P[i];
      const b = P[(i + 1) % n];
      landPath.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
    landPath.closePath();
  });

  ctx.strokeStyle = 'rgba(130,195,205,0.22)';
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.stroke(landPath);

  ctx.save();
  ctx.clip(landPath);

  const lg = ctx.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0.000, '#e9f2fa');
  lg.addColorStop(0.055, '#c3cbbd');
  lg.addColorStop(0.140, '#8f9779');
  lg.addColorStop(0.220, '#4b6440');
  lg.addColorStop(0.320, '#577b41');
  lg.addColorStop(0.440, '#6d8b3e');
  lg.addColorStop(0.500, '#417a33');
  lg.addColorStop(0.560, '#6d8b3e');
  lg.addColorStop(0.680, '#577b41');
  lg.addColorStop(0.800, '#4b6440');
  lg.addColorStop(0.880, '#8f9779');
  lg.addColorStop(1.000, '#e9f2fa');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);

  function blob(lon, lat, rLon, rLat, rgb, a) {
    const x = X(lon), y = Y(lat);
    const rx = rLon / 360 * W;
    const ry = rLat / 180 * H;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(rx, ry);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0.00, `rgba(${rgb},${a})`);
    g.addColorStop(0.55, `rgba(${rgb},${a * 0.82})`);
    g.addColorStop(1.00, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const DESERT = '212,183,116';
  const FOREST = '28,72,30';
  const BOREAL = '42,72,46';
  const SAVAN  = '152,148,72';
  const TUNDRA = '112,116,96';

  blob(   8,  22, 30,  9, DESERT, 0.95);
  blob(  45,  22, 11,  8, DESERT, 0.95);
  blob(  57,  30, 11,  6, DESERT, 0.85);
  blob(  92,  40, 22,  8, DESERT, 0.85);
  blob(  22, -23,  9,  7, DESERT, 0.85);
  blob( 133, -25, 19, 11, DESERT, 0.95);
  blob( -69, -22,3.5,  8, DESERT, 0.85);
  blob(-110,  33,  9,  6, DESERT, 0.80);
  blob( -69, -46,  5,  7, DESERT, 0.60);

  blob( -62,  -4, 19, 10, FOREST, 0.85);
  blob(  22,   0, 14,  7, FOREST, 0.85);
  blob( 112,   0, 20, 10, FOREST, 0.80);
  blob(  75,  13,  5,  8, FOREST, 0.55);

  blob(-100,  58, 45,  9, BOREAL, 0.80);
  blob( 100,  60, 55,  9, BOREAL, 0.80);
  blob(  25,  63, 12,  5, BOREAL, 0.70);

  blob(  30,   8, 30,  8, SAVAN,  0.45);
  blob( -60, -12, 22,  6, SAVAN,  0.40);

  blob(  60,  70, 60,  7, TUNDRA, 0.60);
  blob(-105,  68, 50,  7, TUNDRA, 0.60);

  ctx.restore();

  /* ---------- 6. 極區冰蓋 ---------- */
  let ig = ctx.createLinearGradient(0, 0, 0, Y(64));
  ig.addColorStop(0.00, 'rgba(245,250,255,1)');
  ig.addColorStop(0.40, 'rgba(232,244,255,0.85)');
  ig.addColorStop(0.75, 'rgba(225,240,255,0.45)');
  ig.addColorStop(1.00, 'rgba(220,238,255,0)');
  ctx.fillStyle = ig;
  ctx.fillRect(0, 0, W, Y(64));

  ig = ctx.createLinearGradient(0, Y(-58), 0, H);
  ig.addColorStop(0.00, 'rgba(220,238,255,0)');
  ig.addColorStop(0.30, 'rgba(228,242,255,0.70)');
  ig.addColorStop(0.70, 'rgba(240,249,255,0.97)');
  ig.addColorStop(1.00, 'rgba(252,254,255,1)');
  ctx.fillStyle = ig;
  ctx.fillRect(0, Y(-58), W, H - Y(-58));

  /* ---------- 7. 輸出 ---------- */
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeLabel(text, color = '#cfe3ff', worldHeight = 1.7) {
  const fontSize = 72, pad = 14;
  const m = document.createElement('canvas').getContext('2d');
  m.font = `600 ${fontSize}px "Microsoft JhengHei", sans-serif`;
  const textW = m.measureText(text).width;

  const c = document.createElement('canvas');
  c.width  = Math.ceil(textW) + pad * 2;
  c.height = fontSize + pad * 2;
  const ctx = c.getContext('2d');
  ctx.font = `600 ${fontSize}px "Microsoft JhengHei", sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: true, depthWrite: false
  }));
  sp.scale.set(worldHeight * c.width / c.height, worldHeight, 1);
  return sp;
}

const _delta      = new THREE.Vector3();

let isLeftSun = true;

function updateSunSide() {
  if (orbiting) {
    isLeftSun = false;
  } else {
    const deg = ((THREE.MathUtils.radToDeg(orbitAngle) % 360) + 360) % 360;
    if ((deg >= 315 || deg < 45) || (deg >= 45 && deg < 135)) {
      isLeftSun = true;
    } else {
      isLeftSun = false;
    }
  }
}

const _Y = new THREE.Vector3(0, 1, 0);
const _dirToSun = new THREE.Vector3();
const _Vh = new THREE.Vector3();
const _V = new THREE.Vector3();

function computeEarthView(outPos, outTgt) {
  _earthPos.copy(earthSystem.position);
  _dirToSun.copy(sun.position).sub(_earthPos).normalize();
  
  if (isLeftSun) {
    _Vh.crossVectors(_dirToSun, _Y).normalize();
  } else {
    _Vh.crossVectors(_Y, _dirToSun).normalize();
  }
  
  const pitch = THREE.MathUtils.degToRad(10);
  _V.copy(_Vh).multiplyScalar(Math.cos(pitch));
  _V.addScaledVector(_Y, -Math.sin(pitch));

  outPos.copy(_earthPos).sub(_V.multiplyScalar(EARTH_CAM_DIST));
  outTgt.copy(_earthPos);
}

/* 開始轉場（可選 onComplete 回呼） */
function startTransitionTo(mode, onComplete) {
  viewMode = mode;
  userInteracted = false;
  if (mode === 'earth' && orbiting) {
    isLeftSun = false;
  }
  transitioning = true;
  transT = 0;
  startCamPos.copy(camera.position);
  startTarget.copy(orbit.target);
  onTransitionComplete = onComplete || null;
  updateViewButtons();
}

/* ==================== UI 邏輯 ==================== */
function syncSlider() {
  const deg = ((THREE.MathUtils.radToDeg(orbitAngle) % 360) + 360) % 360;
  orbitSlider.value = deg.toFixed(1);
  angleVal.textContent = deg.toFixed(0) + '°';
}

function setOrbiting(v) {
  orbiting = v;
  playBtn.textContent = v ? '暫停公轉' : '繼續公轉';
  if (v) hideSeasonInfo();
  updateSunSide();
}

function updateViewButtons() {
  globalViewBtn.classList.toggle('active', viewMode === 'global');
  earthViewBtn.classList.toggle('active', viewMode === 'earth');
}

function onEarthJumped() {
  if (viewMode === 'earth') startTransitionTo('earth');
}

function showSeasonInfo(key) {
  const d = SEASON_INFO[key];
  if (!d) return;
  ibTitle.textContent  = d.title;
  ibSun.textContent    = d.sunPos;
  ibDay.textContent    = d.dayLength;
  ibNight.textContent  = d.nightLength;
  ibZenith.textContent = d.zenith;
  ibAlt.textContent    = d.altitude;
  infoBox.classList.add('show');
}

function hideSeasonInfo() {
  infoBox.classList.remove('show');
  /* 關閉文字框時，黃道面透明度回到初始值 */
  eclipticSlider.value = ECLIPTIC_BASE_PERCENT;
  eclipticVal.textContent = ECLIPTIC_BASE_PERCENT + '%';
  applyEclipticOpacity(ECLIPTIC_BASE_PERCENT);
}

/* 黃道面滑桿 */
eclipticSlider.addEventListener('input', () => {
  const v = parseFloat(eclipticSlider.value);
  eclipticVal.textContent = v + '%';
  applyEclipticOpacity(v);
});

orbitSlider.addEventListener('input', () => {
  setOrbiting(false);
  orbitAngle = THREE.MathUtils.degToRad(parseFloat(orbitSlider.value));
  angleVal.textContent = parseFloat(orbitSlider.value).toFixed(0) + '°';
  onEarthJumped();
  hideSeasonInfo();
  updateSunSide();
});

playBtn.addEventListener('click', () => setOrbiting(!orbiting));

speedBtn.addEventListener('click', () => {
  speedIndex = (speedIndex + 1) % SPEEDS.length;
  speedMultiplier = SPEEDS[speedIndex];
  speedBtn.textContent = '速率 ' + speedMultiplier + '×';
});

globalViewBtn.addEventListener('click', () => {
  startTransitionTo('global');
  hideSeasonInfo();
});

earthViewBtn.addEventListener('click', () => {
  startTransitionTo('earth');
  hideSeasonInfo();
});

/* 季節按鈕：在地球視角下切換節氣時，先退到整體視角再進入新節氣的地球視角 */
document.querySelectorAll('.seasons button').forEach(btn => {
  btn.addEventListener('click', () => {
    const wasEarthView = (viewMode === 'earth');

    orbitAngle = THREE.MathUtils.degToRad(parseFloat(btn.dataset.angle));
    setOrbiting(false);
    syncSlider();
    showSeasonInfo(btn.dataset.season);
    updateSunSide();

    if (wasEarthView) {
      // 兩階段轉場：earth → global → earth（新節氣）
      startTransitionTo('global', () => {
        startTransitionTo('earth');
      });
    } else {
      // 非地球視角：清除任何殘留的轉場回呼
      onTransitionComplete = null;
    }
  });
});

/* ==================== 全螢幕 ==================== */
fsBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else alert('此瀏覽器不支援全螢幕，請使用瀏覽器選單手動操作。');
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch (e) {
    console.warn('Fullscreen error:', e);
  }
});

/* ==================== 尺寸調整與自適應相機 ==================== */
function onResize() {
  const w = innerWidth;
  const h = innerHeight;

  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';

  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const aspect = w / h;
  
  const pitch = 15 * Math.PI / 180;
  BASE_CAM_DIR.set(0, Math.sin(pitch), Math.cos(pitch)).normalize();

  const boundR = 38;
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const dV = boundR / Math.tan(vFov / 2);
  const dH = boundR / Math.tan(hFov / 2);
  
  const finalDist = Math.max(dV, dH) * 1.05; 
  
  GLOBAL_CAM_POS.copy(BASE_CAM_DIR).multiplyScalar(finalDist);

  if (viewMode === 'global' && !transitioning) {
    startTransitionTo('global');
  }
}

addEventListener('resize', onResize);

/* ==================== 動畫迴圈 ==================== */
const SPIN_ANGLE_PER_SEC     = (Math.PI * 2) / SPIN_PERIOD;
const SUN_SPIN_ANGLE_PER_SEC = (Math.PI * 2) / SUN_SPIN_PERIOD;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.08);
  const simDt = dt * speedMultiplier;

  totalTime += dt;

  /* --- 太陽自轉 --- */
  sun.rotation.y += SUN_SPIN_ANGLE_PER_SEC * simDt;

  /* --- 公轉（逆時針） --- */
  if (orbiting) {
    orbitAngle += (Math.PI * 2 / ORBIT_PERIOD) * simDt;
    if (orbitAngle >= Math.PI * 2) orbitAngle -= Math.PI * 2;
    syncSlider();
  }

  const cx = Math.cos(orbitAngle);
  const sz = Math.sin(orbitAngle);

  earthSystem.position.set(ORBIT_R * cx, 0, -ORBIT_R * sz);

  /* --- 地球自轉 --- */
  earth.rotation.y += SPIN_ANGLE_PER_SEC * simDt;

  /* --- 視角目標 --- */
  if (viewMode === 'earth') {
    computeEarthView(_desiredPos, _desiredTgt);
  } else {
    _desiredPos.copy(GLOBAL_CAM_POS);
    _desiredTgt.copy(GLOBAL_CAM_TARGET);
  }

  /* --- 視角過渡 / 跟隨 / 自由控制 --- */
  if (transitioning) {
    transT += dt / TRANS_DUR;
    const t = Math.min(transT, 1);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(startCamPos, _desiredPos, e);
    orbit.target.lerpVectors(startTarget, _desiredTgt, e);
    camera.lookAt(orbit.target);
    if (t >= 1) {
      transitioning = false;
      orbit.syncFromCamera();
      if (onTransitionComplete) {
        const cb = onTransitionComplete;
        onTransitionComplete = null;
        cb();
      }
    }
  } else {
    if (viewMode === 'earth') {
      if (!userInteracted) {
        camera.position.lerp(_desiredPos, 0.15);
        orbit.target.lerp(_desiredTgt, 0.15);
        camera.lookAt(orbit.target);
        orbit.syncFromCamera();
      } else {
        _delta.copy(earthSystem.position).sub(orbit.target);
        orbit.target.copy(earthSystem.position);
        camera.position.add(_delta);
        orbit.update();
      }
    } else {
      orbit.update();
    }
  }

  renderer.render(scene, camera);
}

/* ==================== 啟動 ==================== */
onResize();
syncSlider();
updateSunSide();
updateViewButtons();
animate();
</script>
</body>
