<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>電流磁效應｜長直導線 → 圓導線</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070f; }
  body {
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:#e8f2ff; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; }

  #title {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none; z-index:10; width:92%;
  }
  #title h1 {
    font-size:clamp(15px,4.2vw,22px); font-weight:700;
    letter-spacing:2px; color:#dff0ff;
    text-shadow:0 0 14px rgba(80,170,255,.85);
  }
  #title p {
    margin-top:6px; font-size:clamp(11px,3vw,13px);
    color:#7fa8c9; letter-spacing:1px;
  }

  #panel {
    position:fixed; left:50%;
    bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; gap:10px; z-index:10; flex-wrap:wrap; justify-content:center;
    width:96%;
  }
  #panel button {
    padding:10px 18px; border-radius:999px;
    border:1px solid rgba(90,180,255,.5);
    background:rgba(10,30,55,.72); color:#cfe9ff;
    font-size:14px; font-family:inherit; cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .12s, background .2s, opacity .2s;
  }
  #panel button:active { transform:scale(.94); background:rgba(30,90,150,.85); }
  #panel button.off { opacity:.45; }
  #panel button.active {
    background:rgba(40,120,200,.9);
    border-color:rgba(150,220,255,.9);
    box-shadow:0 0 14px rgba(80,180,255,.6);
  }
  #panel button.hidden { display:none; }

  /* ─────── 全螢幕按鈕（僅手機 / 觸控裝置顯示） ─────── */
  #fsBtn {
    display: none;
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    z-index: 20;
    width: 44px; height: 44px;
    align-items: center; justify-content: center;
    border-radius: 12px; cursor: pointer;
    background: rgba(10, 20, 38, .78);
    border: 1px solid rgba(80, 150, 255, .28);
    color: #9fc4ee;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: all .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #fsBtn:hover { background: rgba(35, 60, 100, .92); color: #dcecff; }
  #fsBtn:active { transform: scale(.94); }
  #fsBtn svg {
    width: 22px; height: 22px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    display: block;
  }
  #fsBtn .ico-exit { display: none; }
  #fsBtn.fs-active .ico-enter { display: none; }
  #fsBtn.fs-active .ico-exit { display: block; }

  /* 手機 / 觸控裝置：顯示全螢幕按鈕 */
  @media (max-width: 820px), (hover: none) and (pointer: coarse) {
    #fsBtn { display: flex; }
  }
</style>
</head>
<body>

<!-- 右上角全螢幕按鈕（手機才顯示） -->
<button id="fsBtn" aria-label="切換全螢幕">
  <svg class="ico-enter" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9V4h5"/>
    <path d="M20 9V4h-5"/>
    <path d="M4 15v5h5"/>
    <path d="M20 15v5h-5"/>
  </svg>
  <svg class="ico-exit" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 4v5H4"/>
    <path d="M15 4v5h5"/>
    <path d="M9 20v-5H4"/>
    <path d="M15 20v-5h5"/>
  </svg>
</button>

<div id="title">
  <h1>電流磁效應 ── 長直導線 / 圓導線</h1>
  <p>手指滑動／滑鼠拖曳　可旋轉視角　·　雙指捏合可縮放</p>
</div>

<div id="panel">
  <button id="btnDir">反轉電流方向</button>
  <button id="btnField">隱藏磁力線</button>
  <button id="btnCenter" class="hidden off">中心磁場：關</button>
  <button id="btnMorph">捲成圓導線</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const UP     = new THREE.Vector3(0, 1, 0);
const Z_AXIS = new THREE.Vector3(0, 0, 1);
const _dir   = new THREE.Vector3();
const _lpos  = new THREE.Vector3();
const _lb    = new THREE.Vector3();

/* ============ 基本常數 ============ */
const WIRE_LEN = 18;
const LIMIT    = WIRE_LEN / 2;
const LOOP_R   = WIRE_LEN / (2 * Math.PI);   // ≈ 2.8648

/* ============ 全螢幕切換 ============ */
const fsBtn = document.getElementById('fsBtn');

function fullscreenElement() {
  return document.fullscreenElement
      || document.webkitFullscreenElement
      || document.msFullscreenElement
      || null;
}

function updateFsBtnState() {
  fsBtn.classList.toggle('fs-active', !!fullscreenElement());
}

fsBtn.addEventListener('click', () => {
  const el = document.documentElement;
  try {
    if (!fullscreenElement()) {
      const req = el.requestFullscreen
               || el.webkitRequestFullscreen
               || el.msRequestFullscreen;
      if (req) {
        const p = req.call(el);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      }
    } else {
      const exit = document.exitFullscreen
                || document.webkitExitFullscreen
                || document.msExitFullscreen;
      if (exit) {
        const p = exit.call(document);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      }
    }
  } catch (e) { /* 不支援則靜默忽略 */ }
});

['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(ev => {
  document.addEventListener(ev, () => {
    updateFsBtnState();
    window.dispatchEvent(new Event('resize'));
  });
});

/* ============ 場景 / 相機 / 渲染器 ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 500
);
camera.position.set(15, 11, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.9;
controls.zoomSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.enablePan = false;

/* ============ 光源 ============ */
scene.add(new THREE.HemisphereLight(0x88bbff, 0x0a1020, 1.0));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
keyLight.position.set(8, 16, 10);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x4a9eff, 1.2);
rimLight.position.set(-10, -6, -12);
scene.add(rimLight);

/* ============ 參考網格 ============ */
const grid = new THREE.GridHelper(26, 26, 0x1d4a72, 0x11253a);
grid.position.y = -9.4;
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

/* ==========================================================
   狀態
   ========================================================== */
let isLoop        = false;       // 目標狀態（點擊後立即更新）
let morph         = 0;           // 0 = 直導線，1 = 圓導線
let morphTarget   = 0;
let isMorphing    = false;       // ★ 是否正在切換形狀
let dirSign       = 1;
let fieldVisible  = true;
let centerVisible = false;

/* ==========================================================
   導線（直 ↔ 圓 可變形）
   ========================================================== */
function wirePoint(t, out) {
  const m     = morph;
  const yLine = -LIMIT + WIRE_LEN * t;
  const ang   = 2 * Math.PI * t;
  const xc    = LOOP_R * Math.sin(ang);
  const yc    = -LOOP_R * Math.cos(ang);
  out.set(xc * m, yLine * (1 - m) + yc * m, 0);
  return out;
}

const wireMat = new THREE.MeshStandardMaterial({
  color: 0xd6e2f0, metalness: 1.0, roughness: 0.22,
  emissive: 0x1a3550, emissiveIntensity: 0.7
});

let wireMesh = null;

function rebuildWire() {
  const N = 160;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    pts.push(wirePoint(i / N, new THREE.Vector3()));
  }
  const curve = new THREE.CatmullRomCurve3(pts);

  let tubeSegs;
  if (morph > 0.001 && morph < 0.999) tubeSegs = 100;
  else tubeSegs = 180;

  const geo = new THREE.TubeGeometry(curve, tubeSegs, 0.13, 8, false);

  if (wireMesh) {
    scene.remove(wireMesh);
    wireMesh.geometry.dispose();
  }
  wireMesh = new THREE.Mesh(geo, wireMat);
  scene.add(wireMesh);
}
rebuildWire();

/* ==========================================================
   電流球
   ========================================================== */
function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0.0, 'rgba(255,250,210,1)');
  grad.addColorStop(0.3, 'rgba(255,215,90,0.85)');
  grad.addColorStop(0.7, 'rgba(255,165,30,0.25)');
  grad.addColorStop(1.0, 'rgba(255,120,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const ballGeo = new THREE.SphereGeometry(0.2, 16, 12);
const ballMat = new THREE.MeshBasicMaterial({ color: 0xfff2b0 });
const glowMat = new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  color: 0xffcc44
});

const BALL_N     = 18;
const BALL_SPEED = 0.12;
const balls = [];

for (let i = 0; i < BALL_N; i++) {
  const mesh = new THREE.Mesh(ballGeo, ballMat);
  const glow = new THREE.Sprite(glowMat);
  glow.scale.setScalar(1.5);
  scene.add(mesh);
  scene.add(glow);
  balls.push({ t: i / BALL_N, mesh, glow });
}

/* ==========================================================
   直導線磁場（水平圓環）
   ========================================================== */
const straightFieldGroup = new THREE.Group();
scene.add(straightFieldGroup);

const straightRingArrows = [];
const STRAIGHT_ARROW_GEO = new THREE.ConeGeometry(0.13, 0.36, 10);

const STRAIGHT_RING_RADII   = [1.8, 3.5, 5.2];
const STRAIGHT_RING_HEIGHTS = [-4.5, 0, 4.5];
const STRAIGHT_ARROWS_PER_RING = [5, 8, 11];

STRAIGHT_RING_RADII.forEach((radius, ri) => {
  const color = new THREE.Color().setHSL(0.53 + ri * 0.035, 0.95, 0.62);

  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.55
  });
  const coneMat = new THREE.MeshStandardMaterial({
    color: 0x4ab8ff, emissive: 0x9fe6ff, emissiveIntensity: 1.8,
    metalness: 0.1, roughness: 0.3
  });

  const count       = STRAIGHT_ARROWS_PER_RING[ri];
  const scaleByRing = radius < 2.5 ? 0.85 : (radius < 4.0 ? 1.0 : 1.2);
  const omega       = 1.3 / radius;

  STRAIGHT_RING_HEIGHTS.forEach(y => {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.023, 8, 128),
      ringMat
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y;
    straightFieldGroup.add(ring);

    for (let i = 0; i < count; i++) {
      const theta = (i / count) * Math.PI * 2;
      const cone  = new THREE.Mesh(STRAIGHT_ARROW_GEO, coneMat);
      cone.scale.setScalar(scaleByRing);
      cone.position.set(
        radius * Math.cos(theta), y, radius * Math.sin(theta)
      );
      _dir.set(Math.sin(theta) * dirSign, 0, -Math.cos(theta) * dirSign);
      cone.quaternion.setFromUnitVectors(UP, _dir);

      straightFieldGroup.add(cone);
      straightRingArrows.push({
        mesh: cone, radius, y, theta, omega, baseScale: scaleByRing
      });
    }
  });
});

/* ==========================================================
   共用材質
   ========================================================== */
const loopRingMat = new THREE.MeshStandardMaterial({
  color: 0x6fe0ff, emissive: 0x3a9fd0, emissiveIntensity: 1.4,
  metalness: 0.1, roughness: 0.4
});
const loopConeMat = new THREE.MeshStandardMaterial({
  color: 0x4ab8ff, emissive: 0x9fe6ff, emissiveIntensity: 1.8,
  metalness: 0.1, roughness: 0.3
});
const centerArrowMat = new THREE.MeshStandardMaterial({
  color: 0x2a7fc0, emissive: 0x1a5a90, emissiveIntensity: 1.6,
  metalness: 0.1, roughness: 0.35
});

const LOOP_ARROW_GEO = new THREE.ConeGeometry(0.11, 0.30, 10);
const loopRingGeoCache = new Map();
function getLoopRingGeo(R) {
  if (!loopRingGeoCache.has(R)) {
    loopRingGeoCache.set(R, new THREE.TorusGeometry(R, 0.028, 8, 96));
  }
  return loopRingGeoCache.get(R);
}

/* ==========================================================
   圓導線磁場（8 組 × 3 層同心圓）
   ========================================================== */
const loopFieldGroup = new THREE.Group();
loopFieldGroup.visible = false;
scene.add(loopFieldGroup);

const loopArrows = [];
const LOOP_FIELD_COUNT = 8;
const LOOP_FIELD_RADII = [0.62, 1.05, 1.48];
const LOOP_ARROWS_PER_RING = 3;

for (let k = 0; k < LOOP_FIELD_COUNT; k++) {
  const ang = (k / LOOP_FIELD_COUNT) * Math.PI * 2;
  const ca = Math.cos(ang), sa = Math.sin(ang);

  const P = new THREE.Vector3(LOOP_R * sa, -LOOP_R * ca, 0);
  const T = new THREE.Vector3(ca, sa, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(Z_AXIS, T);

  LOOP_FIELD_RADII.forEach(R => {
    const torus = new THREE.Mesh(getLoopRingGeo(R), loopRingMat);
    torus.position.copy(P);
    torus.quaternion.copy(q);
    loopFieldGroup.add(torus);

    for (let i = 0; i < LOOP_ARROWS_PER_RING; i++) {
      const phi = (i / LOOP_ARROWS_PER_RING) * Math.PI * 2;
      const cone = new THREE.Mesh(LOOP_ARROW_GEO, loopConeMat);
      loopFieldGroup.add(cone);
      loopArrows.push({
        mesh: cone, P: P.clone(), q: q.clone(), phi,
        ringR: R, omega: 0.85 / R
      });
    }
  });
}

function updateLoopArrows() {
  for (const a of loopArrows) {
    const cp = Math.cos(a.phi);
    const sp = Math.sin(a.phi);

    _lpos.set(a.ringR * cp, a.ringR * sp, 0)
         .applyQuaternion(a.q)
         .add(a.P);
    a.mesh.position.copy(_lpos);

    _lb.set(-sp, cp, 0)
       .multiplyScalar(dirSign)
       .applyQuaternion(a.q)
       .normalize();
    a.mesh.quaternion.setFromUnitVectors(UP, _lb);
  }
}
updateLoopArrows();

/* ==========================================================
   圓導線中央的整體磁場箭頭 (長度加倍)
   ========================================================== */
const centerArrowGroup = new THREE.Group();
centerArrowGroup.visible = false;
scene.add(centerArrowGroup);

const CENTER_SHAFT_LEN = 6.0;
const CENTER_HEAD_H    = 1.2;

const centerShaft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.11, 0.11, CENTER_SHAFT_LEN, 16),
  centerArrowMat
);
centerShaft.position.y = -0.6;

const centerHead = new THREE.Mesh(
  new THREE.ConeGeometry(0.28, CENTER_HEAD_H, 16),
  centerArrowMat
);
centerHead.position.y = 2.4 + CENTER_HEAD_H / 2;

centerArrowGroup.add(centerShaft, centerHead);

function updateCenterArrowDirection() {
  centerArrowGroup.rotation.x = dirSign > 0 ? Math.PI / 2 : -Math.PI / 2;
}
updateCenterArrowDirection();

/* ==========================================================
   文字標籤
   ========================================================== */
function makeLabelSprite() {
  const mat = new THREE.SpriteMaterial({
    transparent: true, depthWrite: false, depthTest: false
  });
  return new THREE.Sprite(mat);
}
function setLabelText(sprite, text, color) {
  const fontSize = 56, pad = 22;
  const font = `700 ${fontSize}px "Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif`;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = font;
  const w = Math.ceil(probe.measureText(text).width) + pad * 2;
  const h = fontSize + pad * 2;

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 18; g.fillStyle = color;
  g.fillText(text, w / 2, h / 2);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;

  const old = sprite.material.map;
  sprite.material.map = tex;
  sprite.material.needsUpdate = true;
  if (old) old.dispose();

  sprite.scale.set(w * 0.017, h * 0.017, 1);
}

const currentLabel = makeLabelSprite();
scene.add(currentLabel);
const fieldLabel = makeLabelSprite();
scene.add(fieldLabel);

function refreshLabels() {
  setLabelText(currentLabel, '電流 I', '#ffd24a');
  setLabelText(fieldLabel, '磁力線 B', '#6fe0ff');
}
refreshLabels();

/* ==========================================================
   可見性 & 按鈕狀態
   ========================================================== */
const btnDir    = document.getElementById('btnDir');
const btnField  = document.getElementById('btnField');
const btnCenter = document.getElementById('btnCenter');
const btnMorph  = document.getElementById('btnMorph');

function updateVisibility() {
  /* ★ 形變中一律隱藏磁力線，直到形狀完全切換完成才依狀態顯示 */
  const showFields = fieldVisible && !isMorphing;

  straightFieldGroup.visible = showFields && !isLoop;
  loopFieldGroup.visible     = showFields && isLoop;
  centerArrowGroup.visible   = showFields && centerVisible && isLoop;

  btnCenter.classList.toggle('hidden', !isLoop);
}

function updateButtonText() {
  if (isLoop) {
    btnMorph.textContent = '攤回直導線';
    btnMorph.classList.add('active');
  } else {
    btnMorph.textContent = '捲成圓導線';
    btnMorph.classList.remove('active');
  }
}

updateVisibility();
updateButtonText();

/* ==========================================================
   按鈕事件
   ========================================================== */
btnDir.addEventListener('click', () => {
  dirSign = -dirSign;
  btnDir.textContent = dirSign > 0 ? '反轉電流方向' : '電流：反向';
  refreshLabels();
  updateLoopArrows();
  updateCenterArrowDirection();
});

btnField.addEventListener('click', () => {
  fieldVisible = !fieldVisible;
  btnField.textContent = fieldVisible ? '隱藏磁力線' : '顯示磁力線';
  btnField.classList.toggle('off', !fieldVisible);
  updateVisibility();
});

btnCenter.addEventListener('click', () => {
  centerVisible = !centerVisible;
  btnCenter.textContent = centerVisible ? '中心磁場：開' : '中心磁場：關';
  btnCenter.classList.toggle('off', !centerVisible);
  updateVisibility();
});

btnMorph.addEventListener('click', () => {
  isLoop = !isLoop;
  morphTarget = isLoop ? 1 : 0;

  /* ★ 若目標與當前一致（極少數連點情況），視為無需形變 */
  isMorphing = (morph !== morphTarget);

  updateVisibility();
  updateButtonText();
});

/* ==========================================================
   動畫
   ========================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  /* ── 形變動畫（完成時恢復磁力線顯示） ── */
  if (morph !== morphTarget) {
    const d = Math.sign(morphTarget - morph);
    morph += d * 2.2 * dt;
    if ((d > 0 && morph >= morphTarget) || (d < 0 && morph <= morphTarget)) {
      morph = morphTarget;
      isMorphing = false;          // ★ 形變完成
      updateVisibility();          // ★ 依當前狀態顯示對應的磁力線
    }
    rebuildWire();
  }

  /* ── 電流球 ── */
  for (const b of balls) {
    b.t += dirSign * BALL_SPEED * dt;
    b.t = ((b.t % 1) + 1) % 1;
    wirePoint(b.t, b.mesh.position);
    b.glow.position.copy(b.mesh.position);

    const s = 0.9 + 0.12 * Math.sin(t * 7 + b.t * 20);
    b.mesh.scale.setScalar(s);
    b.glow.scale.setScalar(1.5 * s);
  }

  /* ── 直導線磁場箭頭流動 ── */
  if (straightFieldGroup.visible) {
    for (const a of straightRingArrows) {
      a.theta -= dirSign * a.omega * dt;
      const sinT = Math.sin(a.theta), cosT = Math.cos(a.theta);
      a.mesh.position.set(a.radius * cosT, a.y, a.radius * sinT);
      _dir.set(sinT * dirSign, 0, -cosT * dirSign);
      a.mesh.quaternion.setFromUnitVectors(UP, _dir);
    }
  }

  /* ── 圓導線磁場箭頭流動 ── */
  for (const a of loopArrows) {
    a.phi += dirSign * a.omega * dt;
    a.phi = ((a.phi % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  }
  if (loopFieldGroup.visible) updateLoopArrows();

  /* ── 標籤位置 ── */
  currentLabel.position.set(
    THREE.MathUtils.lerp(3.0, LOOP_R + 2.2, morph),
    THREE.MathUtils.lerp(8.3, LOOP_R + 1.4, morph),
    0
  );
  fieldLabel.position.set(
    THREE.MathUtils.lerp(7.6, -LOOP_R - 1.8, morph),
    THREE.MathUtils.lerp(0.9, -1.6, morph),
    0
  );

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
