<head>

<title>1-5 電解實驗台 ｜ 電解、電鍍與電流的化學效應</title>
<style>
/* ── 共用主題（第一章教具）────────────────────────────────────
   深色投影友善版面：左舞台、右控制面板；手機改上圖下面板。
   每支教具只在自己的樣式區塊內補排版微調，不重複這份色彩設定。
   ─────────────────────────────────────────────────────────── */
:root {
  --bg: #04080f;
  --card: rgba(13, 23, 38, 0.92);
  --card-solid: #0d1726;
  --line: rgba(120, 170, 220, 0.16);
  --line-2: rgba(120, 170, 220, 0.3);
  --text: #e7f1ff;
  --muted: #8ea6c4;
  --dim: #6b829f;
  --cyan: #5fe0ff;
  --amber: #ffc46b;
  --green: #5ce6a5;
  --red: #ff7d7d;
  --magenta: #ff8fd0;
  --violet: #b39dff;
  --copper: #e08a5a;
  --zinc: #b9c4d0;
  --radius: 16px;
  --fs-1: 12.5px;
  --fs-2: 13.5px;
  --fs-3: 15px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;

  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.shell {
  max-width: 1560px;
  margin: 0 auto;
  padding: 18px 18px 42px;
}

/* ── 頁首 ─────────────────────────────────────────────────── */
header.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.eyebrow {
  font-size: 11.5px;
  letter-spacing: 0.26em;
  color: var(--cyan);
  font-weight: 700;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.eyebrow::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 14px var(--cyan);
}

h1 {
  font-size: clamp(19px, 2.1vw, 27px);
  margin: 0;
  letter-spacing: 0.02em;
  font-weight: 700;
  display: inline-block;
  background: linear-gradient(90deg, #8fe8ff, #b8a8ff 55%, #ffc78f);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sub {
  margin: 7px 0 0;
  font-size: var(--fs-1);
  color: var(--muted);
  letter-spacing: 0.03em;
  line-height: 1.6;
}

.head-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;

.layout {

  gap: 16px;
  align-items: start;
}

.stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(20, 36, 58, 0.55), rgba(8, 16, 28, 0.92));
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5), inset 0 0 70px rgba(60, 140, 255, 0.05);

}

.stage canvas {
  display: block;
  width: 100%;
  height: 100%;

}

.panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.card {

}

}

  font-weight: 600;
  cursor: pointer;
  transition: 0.16s;

}

.seg button:hover:not(:disabled) { color: var(--text); background: rgba(95, 224, 255, 0.09); }
.seg button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

<div class="shell">
  <header class="top">
    <div>
      <div class="eyebrow">第一章 電與生活 ｜ 1-5 電解–電流的化學效應</div>
      <h1>電解實驗台</h1>
      <p class="sub">換電極、換電解液，看清楚正極與負極各自發生什麼反應。</p>
    </div>
    <div class="head-side">
      <span class="badge ok" id="runBadge">通電中</span>

  <div class="layout">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="電解槽實驗畫面"></canvas>
    </div>

    <div class="panel">
      <section class="card">
        <h2>選擇情境</h2>
        <div class="scene-grid" id="sceneGrid">
          <button data-scene="water"><b>水的電解</b><span>碳棒＋稀硫酸</span></button>
          <button data-scene="cusulfate_carbon"><b>碳棒電解硫酸銅</b><span>碳棒不反應</span></button>
          <button data-scene="cusulfate_copper"><b>銅棒電解硫酸銅</b><span>電極本身參與</span></button>
          <button data-scene="plating"><b>電鍍</b><span>鐵湯匙鍍銅</span></button>
        </div>
      </section>

      <section class="card">
        <h2>電源控制</h2>
        <div class="row">
          <div class="row-head"><span>電壓（電壓越大，反應越快）</span><b id="vVal">6 V</b></div>
          <input type="range" id="vRange" min="1.5" max="12" step="0.5" value="6" aria-label="電壓">
        </div>
        <div class="row">
          <div class="row-head"><span>動畫速度</span><b id="spVal">1.0×</b></div>
          <input type="range" id="spRange" min="0.3" max="2" step="0.1" value="1" aria-label="動畫速度">
        </div>
        <div class="btn-row">
          <button class="btn primary" id="runBtn">暫停</button>
          <button class="btn ghost" id="resetBtn">重置</button>
        </div>
        <p class="hint" style="margin-top:9px">
          電子流：電源負極 → 負極板（陰極）→ 溶液 → 正極板（陽極）→ 電源正極。
        </p>

      <section class="card">

<script>
/* 數值與分數格式化：讓 6/11 Ω 這種答案以分數呈現，而不是 0.545454… */
(function (g) {
  const NS = (g.DSH1 = g.DSH1 || {});

  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) {
      const t = a % b;
      a = b;
      b = t;
    }
    return a || 1;
  }

  /** 以連分數逼近 x，回傳 {n, d} 或 null。 */
  function frac(x, maxDen = 9999, tol = 1e-9) {
    if (!Number.isFinite(x) || Math.abs(x) > 1e9) return null;
    const neg = x < 0;
    const v = Math.abs(x);
    let h1 = 1;
    let h0 = 0;
    let k1 = 0;
    let k0 = 1;
    let b = v;
    for (let i = 0; i < 32; i += 1) {
      const a = Math.floor(b);
      const h2 = a * h1 + h0;
      const k2 = a * k1 + k0;
      h0 = h1;
      h1 = h2;
      k0 = k1;
      k1 = k2;
      if (k1 > maxDen) return null;
      if (k1 > 0 && Math.abs(v - h1 / k1) <= tol * Math.max(1, v)) {
        return { n: neg ? -h1 : h1, d: k1 };
      }
      const rest = b - a;
      if (rest < 1e-12) break;
      b = 1 / rest;
      if (!Number.isFinite(b)) break;
    }
    return null;
  }

  /** 一般數字：固定小數再去除多餘 0（整數不會被切掉尾端的 0）。 */
  function num(x, digits = 2) {
    if (!Number.isFinite(x)) return '—';
    if (Math.abs(x) >= 1e6) return x.toExponential(2);
    let s = x.toFixed(digits);
    if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }

  /** 電阻：優先分數（分母 ≤ 3 位數），否則小數。回傳 {text, sub}。 */
  function res(x) {
    if (!Number.isFinite(x)) return { text: '∞', sub: '斷路' };
    const f = frac(x);
    if (f && f.d !== 1 && f.d <= 999 && Math.abs(f.n) <= 9999) {
      return { text: `${f.n}/${f.d}`, sub: `${num(x, 3)}` };
    }
    return { text: num(x, 2), sub: '' };
  }

  /** 將一串數值化成最簡整數比，例如 [3,2,1] → "3 : 2 : 1"；失敗回 null。 */
  function ratio(values) {
    const pos = values.filter((v) => v > 1e-9);
    if (pos.length < 2) return null;
    const base = Math.min(...pos);
    const rel = values.map((v) => v / base);
    for (let s = 1; s <= 30; s += 1) {
      const scaled = rel.map((v) => v * s);
      if (scaled.every((v) => Math.abs(v - Math.round(v)) < 0.04)) {
        return scaled.map((v) => Math.round(v));
      }
    }
    return null;
  }

  function ratioText(values) {
    const r = ratio(values);
    return r ? r.join(' : ') : '—';
  }

  NS.fmt = { gcd, frac, num, res, ratio, ratioText };
})(globalThis);

/* 電解／電鍍化學計量：所有數字都由通過的電荷量算出來，不寫死。
   反應式與現象文字依講義 1-5（p.22–28）原文整理。 */
(function (g) {
  const NS = (g.DSH1 = g.DSH1 || {});
  const FARADAY = 96485; // C / mol e⁻
  const MOLAR_VOLUME = 22400; // mL / mol（常溫常壓近似）
  const M_CU = 63.5;

    }
  }

  // 銅棒溶解：寬度變窄 + 邊緣被溶液「咬」出缺口 + 缺口上冒藍色小點
  function drawDissolvingAnode(cx, top, h, wear) {
    const p = Math.max(0, Math.min(1, wear));
    const half = (30 * (1 - 0.42 * p)) / 2;
    const bite = 1.2 + 8.5 * p;
    const N = 26;
    const edgeAt = (i, phase) => {
      const y = top + (h * i) / N;
      const under = y > 276 ? 1 : 0.14; // 只有泡在溶液裡的部分會被腐蝕
      const notch = Math.abs(Math.sin(i * 2.3 + phase) * 0.6 + Math.sin(i * 4.7 + phase * 1.7) * 0.4);
      return half - bite * under * (0.3 + 0.7 * notch);
    };

    ctx.beginPath();
    for (let i = 0; i <= N; i += 1) {
      const y = top + (h * i) / N;
      ctx.lineTo(cx - edgeAt(i, 0.7), y);
    }
    for (let i = N; i >= 0; i -= 1) {
      const y = top + (h * i) / N;
      ctx.lineTo(cx + edgeAt(i, 2.1), y);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - half, 0, cx + half, 0);
    g.addColorStop(0, '#c9793f');
    g.addColorStop(0.5, '#d98b52');
    g.addColorStop(1, '#8d4f26');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 190, 130, .45)';
    ctx.lineWidth = px(1.2);
    ctx.stroke();

    // 溶液吃掉金屬的藍色小點：從邊緣往內長
    if (p > 0.02) {
      const dotR = px(1.3 + 4.2 * p);
      const blue = 'rgba(112, 188, 250, .95)';
      for (let i = 1; i < N; i += 1) {
        const y = top + (h * i) / N;
        if (y < 282) continue;
        const eL = edgeAt(i, 0.7);
        const eR = edgeAt(i, 2.1);
        dot(cx - eL + dotR * 0.5, y, dotR, blue);
        dot(cx + eR - dotR * 0.5, y, dotR, blue);
      }
    }
  }

  function drawBar(cx, top, w, h, colors) {
    const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    g.addColorStop(0, colors[0]);
    g.addColorStop(0.5, colors[0]);
    g.addColorStop(1, colors[1]);
    ctx.fillStyle = g;
    roundRect(cx - w / 2, top, w, h, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.lineWidth = px(1.2);
    ctx.stroke();
  }

  function drawSpoon(grow) {
    // 手柄
    ctx.strokeStyle = '#9aa8b8';
    ctx.lineWidth = px(8);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(594, 168);
    ctx.lineTo(594, 300);
    ctx.stroke();
    // 匙面
    ctx.beginPath();
    ctx.ellipse(594, 346, 22, 34, 0, 0, TAU);
    ctx.fillStyle = '#b9c6d4';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.lineWidth = px(1.4);
    ctx.stroke();
    // 銅鍍層（由下往上長）
    if (grow > 0.005) {
      const coat = Math.min(1, grow * 2.2);
      const grad = ctx.createLinearGradient(0, 312, 0, 386);
      grad.addColorStop(0, `rgba(214, 138, 84, ${0.1 * coat})`);
      grad.addColorStop(1, `rgba(201, 121, 63, ${0.92 * coat})`);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(594, 346, 22, 34, 0, 0, TAU);
      ctx.clip();
      ctx.fillStyle = grad;
      ctx.fillRect(568, 310, 52, 76);
      ctx.restore();
    }
    text('鐵湯匙', 594, 404, { size: 17, color: '#dbe8f6' });
  }

  function drawBubbles() {
    sim.bubbles.forEach((b) => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = b.gold ? 'rgba(255, 220, 160, .55)' : 'rgba(185, 235, 255, .55)';
      ctx.fill();
      ctx.strokeStyle = b.gold ? 'rgba(255, 235, 190, .8)' : 'rgba(210, 245, 255, .8)';
      ctx.lineWidth = px(1);
      ctx.stroke();
    });
  }

  function drawDeposits() {
    sim.deposits.forEach((d) => {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, TAU);
      ctx.fillStyle = 'rgba(220, 130, 70, .8)';
      ctx.fill();
    });
  }

  function drawIons() {
    const sc = sim.scene;
    const warmColor = sc.solution === 'clear' ? 'rgba(180,220,255,.35)' : 'rgba(120,180,255,.5)';
    const coolColor = 'rgba(170, 200, 225, .35)';
    sim.ions.forEach((p) => {
      dot(p.x, p.y, px(p.r), p.warm ? warmColor : coolColor);
    });
  }

  const BAR_NOTES = {
    water: 'H₂ 體積是 O₂ 的 2 倍',
    cusulfate_carbon: 'O₂ 與析銅量各自累積',
    cusulfate_copper: '正極溶解量＝負極析出量',
    plating: '銅棒溶解量＝湯匙鍍銅量',
  };

  function drawBars(a) {
    const sc = sim.scene;
    const bx = 742;
    const by = 188;
    const bw = 212;
    const bh = 320;

    ctx.fillStyle = 'rgba(10, 20, 34, .55)';
    roundRect(bx, by, bw, bh, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,170,220,.2)';
    ctx.lineWidth = px(1.2);
    ctx.stroke();

    text(BAR_NOTES[sc.id] || '', bx + bw / 2, by + 20, { size: 15, color: '#9fffc8', weight: 600 });

    const defs = [sc.bars.a, sc.bars.b];
    const vals = defs.map((d) => a[d.key] || 0);
    // 滿刻度取「好讀的級距」，液面會持續上升；H₂ 永遠是 O₂ 的兩倍高
    const need = Math.max(vals[0], vals[1], 1e-9);
    const NICE = [0.2, 0.5, 1, 2, 5, 10, 20, 40, 80, 160, 320, 640, 1280];
    const maxV = NICE.find((v) => v >= need * 1.3) || need * 1.5;
    const baseY = by + bh - 52;
    const maxH = 210;

    // 目前刻度（換級距時液面會一起變化）；兩支單位不同時就不標，避免誤會
    if (defs[0].unit === defs[1].unit) {
      text(`滿刻度 ${fmt.num(maxV, 0)} ${defs[0].unit}`, bx + bw - 12, by + 40, {
        size: 9.5,
        color: 'rgba(150, 178, 205,.8)',
        align: 'right',
      });
    }

    defs.forEach((d, i) => {
      const val = vals[i];
      const fill = Math.max(0, Math.min(1, val / maxV));
      const x = bx + 38 + i * 112;
      const h = fill * maxH;

      ctx.fillStyle = 'rgba(255,255,255,.045)';
      roundRect(x, baseY - maxH, 50, maxH, 10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,190,230,.3)';
      ctx.lineWidth = px(1.2);
      ctx.stroke();

      if (h > 0.5) {
        const grad = ctx.createLinearGradient(0, baseY - h, 0, baseY);
        grad.addColorStop(0, i === 0 ? 'rgba(255, 196, 107, .95)' : 'rgba(95, 224, 255, .95)');
        grad.addColorStop(1, i === 0 ? 'rgba(255, 140, 80, .5)' : 'rgba(80, 150, 255, .45)');
        ctx.fillStyle = grad;
        roundRect(x, baseY - h, 50, Math.max(2, h), 8);
        ctx.fill();
        // 液面刻度線
        line([x - 3, baseY - h], [x + 53, baseY - h], 'rgba(255,255,255,.8)', px(1.6));
      }

      text(d.label, x + 25, baseY + 20, { size: 16, color: '#b6cbe0' });
      text(`${fmt.num(val, val < 10 ? 2 : 0)} ${d.unit}`, x + 25, baseY + 38, {
        size: 11.5,
        color: '#e6f2ff',
        mono: true,
      });
    });
  }

  function drawLabels(a) {
    const sc = sim.scene;
    text(sc.anodeLabel, 386, 196, { size: 18, color: '#ffc46b', weight: 700 });
    text(sc.cathodeLabel, 594, 196, { size: 18, color: '#7fe6ff', weight: 700 });
    // 極性
    text('＋', 386, 146, { size: 20, color: '#ffc46b', mono: true, weight: 700 });
    text('−', 594, 146, { size: 20, color: '#a8bdd6', mono: true, weight: 700 });

    // 電極材質
    if (sc.id === 'water' || sc.id === 'cusulfate_carbon') {
      text('碳棒', 386, 488, { size: 17, color: '#c7d2de' });
      text('碳棒', 594, 488, { size: 17, color: '#c7d2de' });
    } else if (sc.id === 'cusulfate_copper') {
      text('銅棒', 386, 488, { size: 17, color: '#e8ab74' });
      text('銅棒', 594, 488, { size: 17, color: '#e8ab74' });
    } else {
      text('銅棒', 386, 488, { size: 17, color: '#e8ab74' });
    }

    // 產物提示
    if (sc.hasGas) {
      text(`↑ ${sc.id === 'water' ? 'O₂' : 'O₂'}`, 340, 250, { size: 11, color: 'rgba(255,220,160,.8)' });
      if (sc.id === 'water') {
        text('↑ H₂', 636, 250, { size: 16, color: 'rgba(190,235,255,.85)' });
      }
    }
    // 溶液濃度（體積莫耳濃度 M）
    if (sc.solution === 'blue') {
      text(`Cu²⁺ 濃度 ${a.cu2M.toFixed(2)} M`, 490, 244, {
        size: 15,
        color: 'rgba(200, 226, 252, .9)',
        mono: true,
      });
    }
  }

  // ── 面板 ──────────────────────────────────────────────────
  function syncPanel() {
    document.querySelectorAll('[data-scene]').forEach((b) => {
      b.classList.toggle('active', b.dataset.scene === sim.id);
    });
    $('vRange').value = String(sim.V);
    $('vVal').textContent = `${fmt.num(sim.V, 1)} V`;
    $('spRange').value = String(sim.speed);
    $('spVal').textContent = `${sim.speed.toFixed(1)}×`;
    $('runBtn').textContent = sim.running ? '暫停' : '通電';
    $('runBtn').classList.toggle('primary', sim.running);
    $('runBadge').textContent = sim.running ? '通電中' : '已暫停';
    $('runBadge').className = `badge ${sim.running ? 'ok' : 'warn'}`;
  }

  function renderPanel() {
    const sc = sim.scene;

    $('anodeTag').textContent = sc.anodeLabel;
    $('cathodeTag').textContent = sc.cathodeLabel;
    $('anodeLine').textContent = sc.anodeReact;
    $('cathodeLine').textContent = sc.cathodeReact;
    $('totalLine').textContent = sc.overallReact;
    $('liquidBlock').hidden = !sc.liquidReact;
    if (sc.liquidReact) $('liquidLine').textContent = sc.liquidReact;

    $('noteList').innerHTML = sc.notes.map((n) => `<li>${n}</li>`).join('');
  }

  // ── 事件 ──────────────────────────────────────────────────
  document.querySelectorAll('[data-scene]').forEach((btn) => {
    btn.addEventListener('click', () => setScene(btn.dataset.scene));
  });

  $('vRange').addEventListener('input', (e) => {
    sim.V = Number(e.target.value);
    syncPanel();
  });

  $('spRange').addEventListener('input', (e) => {
    sim.speed = Number(e.target.value);
    syncPanel();
  });

  $('runBtn').addEventListener('click', () => {
    sim.running = !sim.running;
    syncPanel();
  });

  $('resetBtn').addEventListener('click', () => {
    sim.Q = 0;
    snapshot = { Q: 0, a: null };
    sim.bubbles = [];
    sim.deposits = [];
    sim.wear = 0;
    sim.running = true;
    syncPanel();
    renderPanel();
  });

  window.addEventListener('resize', resize);

  // ── 啟動 ──────────────────────────────────────────────────
  resize();
  setScene('water');
  renderPanel();
  setInterval(renderPanel, 150);
  requestAnimationFrame(draw);

  window.__APP_READY__ = true;
  window.__MODEL__ = {
    scenarios: SCENARIOS.map((s) => s.id),
    getState() {
      const a = amounts(sim.id, sim.Q);
      return {
        id: sim.id,
        Q: sim.Q,
        V: sim.V,
        running: sim.running,
        amounts: a,
        reactions: {
          anode: sim.scene.anodeReact,
          cathode: sim.scene.cathodeReact,
          total: sim.scene.overallReact,
        },
      };
    },
    setScene,
    setVoltage(v) {
      sim.V = v;
      syncPanel();
      return this.getState();
    },
    pause() {
      sim.running = false;
      syncPanel();
    },
    resume() {
      sim.running = true;
      syncPanel();
    },
    advance(q) {
      sim.Q += q;
      renderPanel();
      return this.getState();
    },
    reset() {
      sim.Q = 0;
      renderPanel();
    },
  };
})();
</script>
</body>
</html>
