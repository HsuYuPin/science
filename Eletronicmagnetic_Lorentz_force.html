<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>帶電粒子在均勻磁場中的運動</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05080f;}
  canvas{display:block;touch-action:none;}

  #hud{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    left:calc(16px + env(safe-area-inset-left));
    z-index:10;
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:#cfe2ff;
    background:rgba(10,20,38,.74);
    border:1px solid rgba(80,150,255,.28);
    border-radius:14px;
    padding:14px 16px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    max-width:min(340px,calc(100vw - 32px));
    user-select:none;-webkit-user-select:none;
  }
  #hud h1{font-size:15px;font-weight:600;letter-spacing:.5px;margin-bottom:5px;color:#e8f2ff;}
  #hud .sub{font-size:11.5px;color:#7fa3cc;margin-bottom:12px;line-height:1.5;}

  #buttons{display:flex;gap:8px;flex-wrap:wrap;}
  button.pbtn{
    flex:1 1 0;min-width:84px;
    padding:9px 6px;border-radius:10px;cursor:pointer;
    font-size:13px;font-weight:600;font-family:inherit;
    border:1px solid rgba(120,170,255,.25);
    background:rgba(20,35,60,.85);
    color:#9fb8d8;
    transition:all .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button.pbtn:hover{background:rgba(35,60,100,.9);color:#dcecff;}
  button.pbtn:active{transform:scale(.97);}
  button.pbtn.sel[data-t="electron"]{background:rgba(30,120,200,.92);border-color:#4fc3ff;color:#fff;box-shadow:0 0 18px rgba(79,195,255,.5);}
  button.pbtn.sel[data-t="proton"]{background:rgba(190,50,70,.92);border-color:#ff6b7d;color:#fff;box-shadow:0 0 18px rgba(255,90,110,.5);}
  button.pbtn.sel[data-t="neutron"]{background:rgba(90,110,130,.92);border-color:#cfd8e3;color:#fff;box-shadow:0 0 18px rgba(200,215,235,.4);}

  /* 磁場方向切換按鈕 */
  #fieldRow{margin-top:8px;display:flex;}
  #fieldBtn{
    flex:1;min-width:0;
    border-color:rgba(120,200,255,.35);
    color:#9fd8ff;
    background:rgba(20,50,80,.85);
  }
  #fieldBtn:hover{background:rgba(30,70,110,.92);color:#dff1ff;}
  #fieldBtn.down{
    border-color:rgba(255,180,120,.35);
    color:#ffcf8a;
    background:rgba(60,40,18,.85);
  }
  #fieldBtn.down:hover{background:rgba(90,60,25,.95);color:#ffe0b0;}

  #speedRow{margin-top:14px;}
  #speedRow .srow{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:#7fa3cc;margin-bottom:7px;letter-spacing:.3px;}
  #speedRow .srow b{font-size:13px;color:#8fd0ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:5px;border-radius:3px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,#4fc3ff,#2a6fd0);
    opacity:.9;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#eaf6ff;border:2px solid #4fc3ff;cursor:pointer;
    box-shadow:0 0 12px rgba(79,195,255,.85);
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;border:2px solid #4fc3ff;
    background:#eaf6ff;cursor:pointer;box-shadow:0 0 12px rgba(79,195,255,.85);
  }

  #hint{
    margin-top:12px;font-size:11.5px;color:#6f8fb5;line-height:1.65;
    border-top:1px solid rgba(80,150,255,.16);padding-top:10px;
  }
  #hint b{color:#9fc4ee;font-weight:600;}

  #legend{
    position:fixed;
    right:calc(16px + env(safe-area-inset-right));
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:10;
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:11.5px;color:#8aa8c8;line-height:1.8;
    background:rgba(10,20,38,.7);
    border:1px solid rgba(80,150,255,.2);
    border-radius:12px;padding:10px 14px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    user-select:none;
  }
  #legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;}

  /* ─────── 全螢幕按鈕（僅手機 / 觸控裝置顯示） ─────── */
  #fsBtn{
    display:none;
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    right:calc(10px + env(safe-area-inset-right));
    z-index:20;
    width:44px;height:44px;
    align-items:center;justify-content:center;
    border-radius:12px;cursor:pointer;
    background:rgba(10,20,38,.78);
    border:1px solid rgba(80,150,255,.28);
    color:#9fc4ee;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:all .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #fsBtn:hover{background:rgba(35,60,100,.92);color:#dcecff;}
  #fsBtn:active{transform:scale(.94);}
  #fsBtn svg{
    width:22px;height:22px;
    fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    display:block;
  }
  #fsBtn .ico-exit{display:none;}
  #fsBtn.fs-active .ico-enter{display:none;}
  #fsBtn.fs-active .ico-exit{display:block;}

  /* ═══════════════════════════════════════════
     手機 / 觸控裝置：精簡 UI
     ═══════════════════════════════════════════ */
  @media (max-width: 820px), (hover: none) and (pointer: coarse) {

    /* 1. 顯示右上角全螢幕按鈕 */
    #fsBtn{ display:flex; }

    /* 2. 下方圖例（文字框）不顯示 */
    #legend{ display:none !important; }

    /* 3. 上方 HUD 的底部說明（提示）不顯示 */
    #hint{ display:none !important; }

    /* HUD 整體縮小，避開右上角按鈕 */
    #hud{
      top:calc(10px + env(safe-area-inset-top));
      left:calc(10px + env(safe-area-inset-left));
      width:min(258px, calc(100vw - 76px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      padding:10px 12px;
      border-radius:12px;
      max-width:none;
    }
    #hud h1{ font-size:13px; margin-bottom:2px; }
    #hud .sub{ font-size:10px; margin-bottom:9px; line-height:1.4; }

    #buttons{ gap:6px; }
    button.pbtn{ padding:8px 4px; font-size:11.5px; border-radius:8px; min-width:0; }

    #fieldRow{ margin-top:6px; }
    #fieldBtn{ font-size:11.5px; padding:8px 4px; border-radius:8px; }

    #speedRow{ margin-top:10px; }
    #speedRow .srow{ font-size:10px; margin-bottom:5px; }
    #speedRow .srow b{ font-size:11.5px; }

    input[type=range]{ height:8px; border-radius:4px; }
    input[type=range]::-webkit-slider-thumb{ width:22px; height:22px; border-width:2px; }
    input[type=range]::-moz-range-thumb{ width:20px; height:20px; border-width:2px; }
  }

  @media (max-height: 480px) and (orientation: landscape){
    #hud{ padding:8px 10px; }
    #hud h1{ font-size:12px; }
    #hud .sub{ display:none; }
    #buttons{ gap:5px; }
    button.pbtn{ padding:6px 4px; font-size:11px; }
    #fieldRow{ margin-top:5px; }
    #fieldBtn{ padding:6px 4px; font-size:11px; }
    #speedRow{ margin-top:8px; }
  }
</style>
</head>
<body>

<!-- 右上角全螢幕按鈕（手機才顯示） -->
<button id="fsBtn" aria-label="切換全螢幕">
  <svg class="ico-enter" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9V4h5"/>
    <path d="M20 9V4h-5"/>
    <path d="M4 15v5h5"/>
    <path d="M20 15v5h-5"/>
  </svg>
  <svg class="ico-exit" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 4v5H4"/>
    <path d="M15 4v5h5"/>
    <path d="M9 20v-5H4"/>
    <path d="M15 20v-5h5"/>
  </svg>
</button>

<div id="hud">
  <h1>帶電粒子在均勻磁場中的運動</h1>
  <div class="sub" id="subLine">磁場 B 鉛直向上（藍色細線 ↑），射向中心</div>
  <div id="buttons">
    <button class="pbtn sel" data-t="electron">電子 e⁻</button>
    <button class="pbtn" data-t="proton">質子 p⁺</button>
    <button class="pbtn" data-t="neutron">中子 n</button>
  </div>

  <div id="fieldRow">
    <button class="pbtn" id="fieldBtn">磁場方向：↑ 向上</button>
  </div>

  <div id="speedRow">
    <div class="srow"><span>射出速率</span><b id="speedVal">4.0</b></div>
    <input id="speedSlider" type="range" min="1" max="25" step="0.1" value="4">
  </div>

  <div id="hint">
    <b>點擊 / 輕觸畫面</b>：粒子從該處射向磁場中心<br>
    <b>拖曳</b> 旋轉視角　·　<b>滾輪 / 雙指</b> 縮放
  </div>
</div>

<div id="legend">
  <i style="background:#4fc3ff;box-shadow:0 0 8px #4fc3ff"></i>電子（負電，半徑小）<br>
  <i style="background:#ff5f6d;box-shadow:0 0 8px #ff5f6d"></i>質子（正電，半徑大）<br>
  <i style="background:#c9d6e4;box-shadow:0 0 8px #c9d6e4"></i>中子（不帶電，直線）
</div>

<canvas id="scene"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════
   全螢幕切換
   ═══════════════════════════════════════════════ */
const fsBtn = document.getElementById('fsBtn');

function fullscreenElement() {
  return document.fullscreenElement
      || document.webkitFullscreenElement
      || document.msFullscreenElement
      || null;
}

function updateFsBtnState() {
  fsBtn.classList.toggle('fs-active', !!fullscreenElement());
}

fsBtn.addEventListener('click', () => {
  const el = document.documentElement;
  try {
    if (!fullscreenElement()) {
      const req = el.requestFullscreen
               || el.webkitRequestFullscreen
               || el.msRequestFullscreen;
      if (req) {
        const p = req.call(el);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      }
    } else {
      const exit = document.exitFullscreen
                || document.webkitExitFullscreen
                || document.msExitFullscreen;
      if (exit) {
        const p = exit.call(document);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      }
    }
  } catch (e) { /* 不支援則靜默 */ }
});

['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(ev => {
  document.addEventListener(ev, () => {
    updateFsBtnState();
    window.dispatchEvent(new Event('resize'));
  });
});

/* ═══════════════════════════════════════════════
   物理參數
   磁場 B = B ŷ（可切換向上 / 向下）
   洛倫茲力 F = q v × B
   圓周運動角頻率 ω = qB/m
   ═══════════════════════════════════════════════ */
const PARTICLE_Y  = 0.38;
const FIELD_R     = 9;
const FIELD_H     = 6;
const MAX_TRAIL   = 340;
const MAX_SPAWN_R = 20;
const MIN_SPAWN_R = 1.0;
const KILL_R      = 100;

/* fieldDir：+1 = 磁場向上（原方向），-1 = 磁場向下 */
let fieldDir = 1;

const TYPES = {
  electron: { label:'電子', charge:-1, omega:-3.0, color:0x4fc3ff, symbol:'−' },
  proton:   { label:'質子', charge: 1, omega: 1.0, color:0xff5f6d, symbol:'+' },
  neutron:  { label:'中子', charge: 0, omega: 0.0, color:0xc9d6e4, symbol:''  }
};

/* ═══════════════════════════════════════════════
   場景 / 相機 / 渲染器
   ═══════════════════════════════════════════════ */
const canvasEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);
scene.fog = new THREE.Fog(0x05080f, 80, 200);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 800);
camera.position.set(10, 16, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 8;
controls.maxDistance = 130;
controls.update();

/* 燈光 */
scene.add(new THREE.HemisphereLight(0x6f92cc, 0x0a1020, 1.7));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(12, 26, 14);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x4488ff, 0.9);
fillLight.position.set(-16, 9, -12);
scene.add(fillLight);

/* ═══════════════════════════════════════════════
   地面 + 磁場區域
   ═══════════════════════════════════════════════ */
const grid = new THREE.GridHelper(160, 80, 0x1b3352, 0x101d2e);
grid.position.y = 0;
grid.material.transparent = true;
grid.material.opacity = 0.85;
scene.add(grid);

const disc = new THREE.Mesh(
  new THREE.CircleGeometry(FIELD_R, 96),
  new THREE.MeshBasicMaterial({ color:0x2a6fd0, transparent:true, opacity:0.06, depthWrite:false })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = 0.02;
scene.add(disc);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(FIELD_R - 0.06, FIELD_R + 0.06, 128),
  new THREE.MeshBasicMaterial({ color:0x3f8de0, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.03;
scene.add(ring);

/* ── 磁力線：細線 + 箭頭 ── */
const fieldGroup = new THREE.Group();
scene.add(fieldGroup);

const lineVerts = [];
const arrowSpots = [];
const GAP = 2.1;
const LIM = 8.4;

for (let x = -LIM; x <= LIM + 1e-6; x += GAP) {
  for (let z = -LIM; z <= LIM + 1e-6; z += GAP) {
    if (Math.hypot(x, z) > FIELD_R - 0.6) continue;
    lineVerts.push(x, 0, z, x, FIELD_H, z);
    arrowSpots.push([x, z]);
  }
}

const fieldLines = new THREE.LineSegments(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(lineVerts, 3)),
  new THREE.LineBasicMaterial({ color:0x4a8ee0, transparent:true, opacity:0.34, depthWrite:false })
);
fieldGroup.add(fieldLines);

const coneGeo = new THREE.ConeGeometry(0.115, 0.42, 8);
coneGeo.translate(0, 0.21, 0);   // 錐底在 0，錐尖在 +0.42
const arrowMesh = new THREE.InstancedMesh(
  coneGeo,
  new THREE.MeshBasicMaterial({ color:0x6fb4ff, transparent:true, opacity:0.9 }),
  arrowSpots.length
);
fieldGroup.add(arrowMesh);

const _dummy = new THREE.Object3D();

/* 依磁場方向重建箭頭的位置與旋轉
   fieldDir = +1 → 箭頭在頂端、尖端朝上
   fieldDir = -1 → 箭頭在底端、尖端朝下（朝地面） */
function updateFieldArrows() {
  arrowSpots.forEach(([x, z], i) => {
    if (fieldDir > 0) {
      _dummy.position.set(x, FIELD_H - 0.42, z);
      _dummy.rotation.set(0, 0, 0);
    } else {
      _dummy.position.set(x, 0.42, z);
      _dummy.rotation.set(Math.PI, 0, 0);
    }
    _dummy.updateMatrix();
    arrowMesh.setMatrixAt(i, _dummy.matrix);
  });
  arrowMesh.instanceMatrix.needsUpdate = true;
}
updateFieldArrows();

/* ═══════════════════════════════════════════════
   貼圖工具
   ═══════════════════════════════════════════════ */
const glowCache = {};
function glowTexture(color) {
  if (glowCache[color]) return glowCache[color];
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(color);
  const r = Math.round(col.r * 255), g = Math.round(col.g * 255), b = Math.round(col.b * 255);
  const grad = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grad.addColorStop(0,    `rgba(${r},${g},${b},0.95)`);
  grad.addColorStop(0.30, `rgba(${r},${g},${b},0.35)`);
  grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(c);
  glowCache[color] = tex;
  return tex;
}

const symCache = {};
function symbolTexture(sym) {
  if (symCache[sym]) return symCache[sym];
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 108px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.strokeText(sym, S/2, S/2 + 6);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(sym, S/2, S/2 + 6);
  const tex = new THREE.CanvasTexture(c);
  symCache[sym] = tex;
  return tex;
}

/* ═══════════════════════════════════════════════
   粒子資源（快取共用）
   ═══════════════════════════════════════════════ */
const assetCache = {};
function assetsFor(key) {
  if (assetCache[key]) return assetCache[key];
  const T = TYPES[key];
  const geo = new THREE.SphereGeometry(0.3, 20, 14);
  const mat = new THREE.MeshStandardMaterial({
    color: T.color, emissive: T.color, emissiveIntensity: 1.3,
    roughness: 0.35, metalness: 0.1
  });
  const glowMat = new THREE.SpriteMaterial({
    map: glowTexture(T.color), color: T.color,
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, opacity: 0.9
  });
  let symMat = null;
  if (T.symbol) {
    symMat = new THREE.SpriteMaterial({
      map: symbolTexture(T.symbol),
      transparent: true, depthTest: false, depthWrite: false
    });
  }
  assetCache[key] = { geo, mat, glowMat, symMat };
  return assetCache[key];
}

function makeParticleMesh(key) {
  const A = assetsFor(key);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(A.geo, A.mat));
  const glow = new THREE.Sprite(A.glowMat);
  glow.scale.set(1.8, 1.8, 1);
  g.add(glow);
  if (A.symMat) {
    const s = new THREE.Sprite(A.symMat);
    s.scale.set(0.44, 0.44, 1);
    s.renderOrder = 999;
    g.add(s);
  }
  return g;
}

/* ═══════════════════════════════════════════════
   粒子生成 / 更新 / 移除
   ═══════════════════════════════════════════════ */
const particles = [];
let currentType = 'electron';
let currentSpeed = 4.0;

function spawnParticle(key, startPos, speed) {
  if (particles.length >= 10) removeParticle(0);

  const T = TYPES[key];

  const dir = new THREE.Vector3(-startPos.x, 0, -startPos.z);
  if (dir.lengthSq() < 1e-8) dir.set(1, 0, 0);
  dir.normalize();

  const group = makeParticleMesh(key);
  group.position.copy(startPos);
  scene.add(group);

  const arr = new Float32Array(MAX_TRAIL * 3);
  const tGeo = new THREE.BufferGeometry();
  tGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  tGeo.setDrawRange(0, 0);
  const trail = new THREE.Line(tGeo, new THREE.LineBasicMaterial({
    color: T.color, transparent: true, opacity: 0.62
  }));
  trail.frustumCulled = false;
  scene.add(trail);

  arr[0] = startPos.x; arr[1] = startPos.y; arr[2] = startPos.z;

  particles.push({
    T,
    omega: T.omega,
    pos: startPos.clone(),
    vel: dir.multiplyScalar(speed),
    group, trail, arr,
    count: 1,
    age: 0
  });
}

function removeParticle(index) {
  const p = particles[index];
  if (!p) return;
  scene.remove(p.group);
  scene.remove(p.trail);
  p.trail.geometry.dispose();
  p.trail.material.dispose();
  particles.splice(index, 1);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;

    const inField = Math.hypot(p.pos.x, p.pos.z) < FIELD_R;

    /* ★ 有效角頻率 = 粒子本身 ω × 磁場方向（磁場翻轉時運動反向） */
    const omega = p.omega * fieldDir;

    if (inField && Math.abs(omega) > 1e-6) {
      const theta = omega * dt;
      const half = theta * 0.5;
      const ch = Math.cos(half), sh = Math.sin(half);
      const vx0 = p.vel.x, vz0 = p.vel.z;

      const vxm = vx0 * ch - vz0 * sh;
      const vzm = vx0 * sh + vz0 * ch;
      p.pos.x += vxm * dt;
      p.pos.z += vzm * dt;

      const c = Math.cos(theta), s = Math.sin(theta);
      p.vel.x = vx0 * c - vz0 * s;
      p.vel.z = vx0 * s + vz0 * c;
    } else {
      p.pos.addScaledVector(p.vel, dt);
    }

    p.group.position.copy(p.pos);

    const a = p.arr;
    if (p.count < MAX_TRAIL) {
      a[p.count * 3]     = p.pos.x;
      a[p.count * 3 + 1] = p.pos.y;
      a[p.count * 3 + 2] = p.pos.z;
      p.count++;
    } else {
      a.copyWithin(0, 3);
      a[(MAX_TRAIL - 1) * 3]     = p.pos.x;
      a[(MAX_TRAIL - 1) * 3 + 1] = p.pos.y;
      a[(MAX_TRAIL - 1) * 3 + 2] = p.pos.z;
    }
    const g = p.trail.geometry;
    g.attributes.position.needsUpdate = true;
    g.setDrawRange(0, p.count);

    if (p.pos.length() > KILL_R || p.age > 90) {
      removeParticle(i);
    }
  }
}

/* ═══════════════════════════════════════════════
   點擊漣漪回饋
   ═══════════════════════════════════════════════ */
const ripples = [];
function spawnRipple(pos) {
  const geo = new THREE.RingGeometry(0.30, 0.40, 44);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x8fd0ff, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, depthWrite: false
  });
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI / 2;
  m.position.copy(pos);
  m.position.y = PARTICLE_Y + 0.01;
  scene.add(m);
  ripples.push({ mesh: m, life: 0, max: 0.55 });
}

function updateRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.life += dt;
    const t = r.life / r.max;
    if (t >= 1) {
      scene.remove(r.mesh);
      r.mesh.geometry.dispose();
      r.mesh.material.dispose();
      ripples.splice(i, 1);
      continue;
    }
    const s = 1 + t * 3.2;
    r.mesh.scale.set(s, s, s);
    r.mesh.material.opacity = 0.9 * (1 - t);
  }
}

/* ═══════════════════════════════════════════════
   互動：點擊 / 輕觸 → 在該處生成粒子，射向中心
   ═══════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const shootPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -PARTICLE_Y);
const hitPoint = new THREE.Vector3();

function screenToPlane(clientX, clientY) {
  ndc.x = (clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const ok = raycaster.ray.intersectPlane(shootPlane, hitPoint);
  return ok ? hitPoint.clone() : null;
}

let downPos = null, downTime = 0;
const el = renderer.domElement;

el.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY };
  downTime = performance.now();
});

el.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const dur = performance.now() - downTime;
  downPos = null;

  if (moved < 10 && dur < 600) {
    const pt = screenToPlane(e.clientX, e.clientY);
    if (!pt) return;

    pt.y = PARTICLE_Y;
    let h = Math.hypot(pt.x, pt.z);

    if (h < MIN_SPAWN_R) return;
    if (h > MAX_SPAWN_R) {
      const k = MAX_SPAWN_R / h;
      pt.x *= k; pt.z *= k;
      h = MAX_SPAWN_R;
    }

    spawnParticle(currentType, pt, currentSpeed);
    spawnRipple(pt);
  }
});

el.addEventListener('pointercancel', () => { downPos = null; });

/* 粒子類型按鈕 */
document.querySelectorAll('button.pbtn[data-t]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('button.pbtn[data-t]').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    currentType = btn.dataset.t;
  });
});

/* ★ 磁場方向切換按鈕 */
const fieldBtn = document.getElementById('fieldBtn');
const subLine = document.getElementById('subLine');

function applyFieldDirection() {
  updateFieldArrows();

  if (fieldDir > 0) {
    fieldBtn.textContent = '磁場方向：↑ 向上';
    fieldBtn.classList.remove('down');
    subLine.textContent = '磁場 B 鉛直向上（藍色細線 ↑），射向中心';
  } else {
    fieldBtn.textContent = '磁場方向：↓ 向下';
    fieldBtn.classList.add('down');
    subLine.textContent = '磁場 B 鉛直向下（藍色細線 ↓），射向中心';
  }
}

fieldBtn.addEventListener('click', () => {
  fieldDir *= -1;
  applyFieldDirection();
});

/* 射出速率滑桿（最大 25） */
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
currentSpeed = parseFloat(speedSlider.value);
speedVal.textContent = currentSpeed.toFixed(1);
speedSlider.addEventListener('input', () => {
  currentSpeed = parseFloat(speedSlider.value);
  speedVal.textContent = currentSpeed.toFixed(1);
});

/* ═══════════════════════════════════════════════
   主迴圈
   ═══════════════════════════════════════════════ */
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updateParticles(dt);
  updateRipples(dt);
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ═══════════════════════════════════════════════
   視窗尺寸
   ═══════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
