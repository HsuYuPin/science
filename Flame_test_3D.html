<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6efe2" />
<title>焰色反應實驗室 3D｜把元素放上燃燒匙</title>
<style>
:root {
  --bg: #f6efe2;
  --paper: #fffdf8;
  --paper-2: #fbf7ee;
  --ink: #1d3935;
  --muted: #6d7f79;
  --line: #e1d6c3;
  --line-strong: #cfc1a9;
  --accent: #e66b35;
  --accent-dark: #b84a1d;
  --accent-soft: #fbe6da;
  --teal: #2f7a6b;
  --teal-dark: #1f5a4f;
  --teal-soft: #e5f2ed;
  --shadow: #eadfc9;
  --shadow-strong: #d9c9ac;
  --yellow: #e8bb38;
  --red: #b84d44;
  --radius: 18px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  overflow: hidden;
  background:
    radial-gradient(920px 520px at 4% -10%, #fff2cf 0%, rgba(255, 242, 207, 0) 62%),
    radial-gradient(900px 560px at 103% 2%, #dcece5 0%, rgba(220, 236, 229, 0) 58%),
    linear-gradient(180deg, #faf6ec 0%, #f5eddf 56%, #efe6d6 100%);
}

button { font: inherit; }

.app {
  height: 100dvh;
  min-height: 650px;
  max-width: 1900px;
  margin: 0 auto;
  padding: 22px 30px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ------------------------------------------------------------------ head */
.masthead {
  flex: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 22px;
}

.brand { min-width: 0; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.18em;
}

.eyebrow::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.title-row {
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  color: #16332f;
  font-size: clamp(34px, 3vw, 48px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: 0.01em;
}

.subtitle {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: clamp(15px, 1.15vw, 18px);
  font-weight: 600;
  line-height: 1.45;
}

.subtitle b { color: var(--ink); font-weight: 800; }

.tools { display: flex; gap: 8px; flex: none; }

.tool {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1.5px solid var(--line-strong);
  border-radius: 12px;
  background: var(--paper);
  color: #34544d;
  box-shadow: 3px 3px 0 var(--shadow);
  cursor: pointer;
  transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
}

.tool:hover {
  transform: translate(-1px, -1px);
  border-color: #b8a88e;
  box-shadow: 4px 4px 0 var(--shadow);
}

.tool:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--shadow); }
.tool:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.tool svg { width: 21px; height: 21px; }
.tool .shrink { display: none; }
.tool.is-full .expand { display: none; }
.tool.is-full .shrink { display: block; }

/* ----------------------------------------------------------- element tray */
.element-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: 18px;
  background: var(--paper);
  box-shadow: 5px 5px 0 var(--shadow);
}

.bar-head {
  flex: none;
  width: 142px;
  padding-left: 3px;
}

.bar-head h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.bar-head p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.35;
}

.element-grid {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 9px;
}

.element {
  position: relative;
  min-width: 0;
  height: 62px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: #fffefa;
  color: var(--ink);
  box-shadow: 3px 3px 0 #f0e7d6;
  cursor: pointer;
  text-align: left;
  transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease, background 0.14s ease;
}

.element:hover {
  transform: translate(-1px, -1px);
  border-color: #b9aa90;
  box-shadow: 4px 4px 0 #ecdfc9;
}

.element:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #f0e7d6; }
.element:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.element.is-selected {
  border-color: var(--teal);
  background: var(--teal-soft);
  box-shadow: 4px 4px 0 #c9e2d9;
}

.element.is-selected::after {
  content: "";
  position: absolute;
  top: 7px;
  right: 7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 3px rgba(47, 122, 107, 0.14);
}

.el-sym {
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
  box-shadow: inset 0 0 0 1px rgba(20, 45, 40, 0.1);
}

.el-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.el-copy b {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
}

.el-copy small {
  overflow: hidden;
  color: #788983;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.25;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* --------------------------------------------------------------- workspace */
.lab-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 392px;
  gap: 18px;
}

.stage-wrap {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1.5px solid #36524c;
  border-radius: 22px;
  background:
    radial-gradient(110% 85% at 54% 30%, #173331 0%, rgba(23, 51, 49, 0) 55%),
    linear-gradient(168deg, #0c1718 0%, #0a1415 48%, #071011 100%);
  box-shadow: 7px 7px 0 var(--shadow);
  isolation: isolate;
}

.stage-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 92px 22px rgba(0, 0, 0, 0.56);
}

.flash-veil {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 253, 239, 0.72) 14%, rgba(255, 238, 190, 0.22) 38%, rgba(255, 225, 160, 0) 68%);
  mix-blend-mode: screen;
  transition: opacity 70ms linear;
}

#stage {
  position: absolute;
  inset: 0;
}

#stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
  outline: none;
}

#stage canvas.dragging { cursor: grabbing; }
#stage canvas:focus-visible { outline: 3px solid var(--teal); outline-offset: -5px; }

.stage-pill {
  position: absolute;
  z-index: 6;
  top: 14px;
  left: 14px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px 8px;
  border: 1px solid rgba(149, 210, 180, 0.24);
  border-radius: 999px;
  background: #0a1a18;
  color: #effcf5;
  box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.28);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  pointer-events: none;
}

.stage-pill::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ffb24e;
  box-shadow: 0 0 0 3px rgba(255, 178, 78, 0.16), 0 0 12px rgba(255, 166, 58, 0.55);
}

.stage-status {
  position: absolute;
  z-index: 6;
  left: 16px;
  bottom: 16px;
  max-width: min(76%, 560px);
  padding: 9px 14px 10px;
  border: 1.5px solid #d6c8b1;
  border-radius: 12px;
  background: #fffdf8;
  color: #27453f;
  box-shadow: 4px 4px 0 rgba(120, 100, 68, 0.14);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.35;
  pointer-events: none;
}

.stage-hint {
  position: absolute;
  z-index: 6;
  right: 16px;
  bottom: 18px;
  padding: 5px 9px;
  border-radius: 8px;
  background: rgba(7, 19, 18, 0.78);
  color: #cfe4dc;
  font-size: 12.5px;
  font-weight: 700;
  pointer-events: none;
}

.leader-svg {
  position: absolute;
  z-index: 4;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}

.scene-label {
  position: absolute;
  z-index: 5;
  transform: translate(-50%, -50%);
  pointer-events: none;
  will-change: left, top;
}

.scene-label .tag {
  display: block;
  padding: 6px 12px 7px;
  border: 2px solid #24473f;
  border-radius: 9px;
  background: #fffdf8;
  color: #18342f;
  box-shadow: 3px 3px 0 rgba(36, 71, 63, 0.16);
  font-size: 26px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.scene-label .tag small {
  display: block;
  margin-top: 1px;
  color: #617770;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

/* ------------------------------------------------------------------ panel */
.panel {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: auto;
  padding: 0 2px 2px 0;
  scrollbar-width: thin;
  scrollbar-color: #c9baa2 transparent;
}

.obs-card {
  flex: none;
  padding: 15px 16px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: 6px 6px 0 var(--shadow);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.obs-card.is-complete {
  border-color: #b7d6ca;
  box-shadow: 6px 6px 0 #d8ebe3;
}

.obs-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.obs-kicker {
  margin: 0 0 3px;
  color: var(--teal);
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.obs-title {
  margin: 0;
  color: #193833;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.2;
}

.obs-sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
}

.status-pill {
  flex: none;
  margin-top: 2px;
  padding: 5px 9px 6px;
  border-radius: 999px;
  background: #f0ebe0;
  color: #6d746e;
  font-size: 12.5px;
  font-weight: 800;
  white-space: nowrap;
}

.status-pill.is-live { background: #fff0d7; color: #9b5a10; }
.status-pill.is-done { background: #e3f3ec; color: #236a56; }

.live-flame {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 12px;
  padding: 10px 12px;
  border: 1.5px solid #e8ddca;
  border-radius: 13px;
  background: #fcf8f0;
}

.flame-orb {
  width: 38px;
  height: 38px;
  flex: none;
  border: 2px solid #d5c6ae;
  border-radius: 50%;
  background: repeating-linear-gradient(135deg, #ece4d6 0 6px, #f8f3e9 6px 12px);
  box-shadow: inset 0 0 0 3px #fffdf8;
}

.flame-orb.is-visible { border-color: rgba(40, 70, 62, 0.25); }

.flame-copy { min-width: 0; flex: 1; }

.row-label {
  display: block;
  margin-bottom: 1px;
  color: #7b877f;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.flame-name {
  display: block;
  color: #213e38;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.2;
}

.flame-hint {
  flex: none;
  padding: 4px 7px;
  border-radius: 7px;
  background: #f1ebdf;
  color: #879089;
  font-size: 12.5px;
  font-weight: 700;
}

.fact-list {
  display: flex;
  flex-direction: column;
  margin-top: 10px;
  border-top: 1px solid #eee4d5;
}

.fact {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 8px 1px;
  border-bottom: 1px solid #f0e7d9;
}

.fact-label {
  color: #7b877f;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
}

.fact-value {
  color: #25443d;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.fact-value .color-mini {
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 5px;
  border: 1.5px solid rgba(33, 61, 54, 0.25);
  border-radius: 50%;
  vertical-align: -1px;
  background: #f1e6d0;
}

.fact-value .color-mini.is-invisible {
  border-style: dashed;
  background: repeating-linear-gradient(135deg, #fff 0 4px, #e8e2d7 4px 8px);
}

.equation {
  margin-top: 10px;
  padding: 9px 11px;
  border: 1.5px solid #eadfc9;
  border-radius: 10px;
  background: #fbf6e8;
  color: #5d6258;
  font-family: "Cascadia Mono", "Consolas", "Microsoft JhengHei", monospace;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.45;
  text-align: center;
  overflow-wrap: anywhere;
}

.actions {
  flex: none;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 104px;
  gap: 10px;
}

.btn {
  height: 56px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 800;
  transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
}

.btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1.5px solid #bc4d1f;
  background: var(--accent);
  color: #fffdf8;
  box-shadow: 4px 4px 0 #ecc5b1;
  font-size: 19px;
  letter-spacing: 0.02em;
}

.btn-primary:hover:not(:disabled) {
  transform: translate(-1px, -1px);
  background: #ed783f;
  box-shadow: 5px 5px 0 #ecc5b1;
}

.btn-primary:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #ecc5b1; }

.btn-primary:disabled {
  cursor: default;
  border-color: #d8b6a2;
  background: #e8b99f;
  color: #fff9f4;
  box-shadow: 3px 3px 0 #f3dfd3;
}

.btn-primary svg { width: 20px; height: 20px; flex: none; }

.btn-secondary {
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  color: #44635b;
  box-shadow: 3px 3px 0 var(--shadow);
  font-size: 15px;
}

.btn-secondary:hover {
  transform: translate(-1px, -1px);
  border-color: #b8a88e;
  box-shadow: 4px 4px 0 var(--shadow);
}

.btn-secondary:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--shadow); }

.lab-note {
  flex: none;
  margin: 0;
  padding: 2px 4px 0;
  color: #788780;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.55;
}

.lab-note b { color: #435f57; font-weight: 800; }

.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* -------------------------------------------------------------- responsive */
@media (min-width: 1760px) {
  .scene-label .tag { font-size: 30px; padding: 7px 14px 8px; }
  .scene-label .tag small { font-size: 14.5px; }
  .lab-grid { grid-template-columns: minmax(0, 1fr) 416px; }
  .obs-title { font-size: 24px; }
  .fact-value { font-size: 16px; }
}

@media (max-height: 840px) and (min-width: 901px) {
  .app { height: 100dvh; min-height: 620px; padding: 14px 20px 14px; gap: 10px; }
  .eyebrow { margin-bottom: 2px; font-size: 12.5px; }
  h1 { font-size: 34px; }
  .subtitle { margin-top: 2px; font-size: 14px; }
  .tool { width: 40px; height: 40px; }
  .element-bar { padding: 8px 10px; gap: 12px; }
  .bar-head { width: 124px; }
  .bar-head h2 { font-size: 15px; }
  .bar-head p { font-size: 12.5px; }
  .element { height: 52px; padding: 6px 7px; gap: 7px; }
  .el-sym { width: 33px; height: 33px; font-size: 16px; border-radius: 8px; }
  .el-copy b { font-size: 15px; }
  .el-copy small { font-size: 12.5px; }
  .lab-grid { gap: 14px; }
  .obs-card { padding: 12px 13px 11px; }
  .obs-title { font-size: 19px; }
  .obs-sub { font-size: 12.5px; }
  .live-flame { margin-top: 9px; padding: 8px 10px; }
  .flame-orb { width: 33px; height: 33px; }
  .flame-name { font-size: 18px; }
  .fact { grid-template-columns: 80px minmax(0, 1fr); padding: 6px 1px; }
  .fact-value { font-size: 13.5px; }
  .equation { margin-top: 7px; padding: 7px 9px; font-size: 12.5px; }
  .btn { height: 50px; }
  .btn-primary { font-size: 17px; }
  .lab-note { font-size: 12.5px; line-height: 1.4; }
  .stage-status { font-size: 14px; bottom: 12px; left: 12px; }
  .stage-hint { font-size: 12.5px; bottom: 14px; right: 12px; }
  .stage-pill { top: 11px; left: 11px; font-size: 12.5px; }
  .scene-label .tag { font-size: 26px; }
}

@media (max-width: 1180px) and (min-width: 901px) {
  .bar-head { width: 112px; }
  .bar-head h2 { font-size: 15px; }
  .el-copy small { display: none; }
  .element { justify-content: center; }
  .lab-grid { grid-template-columns: minmax(0, 1fr) 350px; }
  .obs-title { font-size: 20px; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .app {
    height: auto;
    min-height: 100dvh;
    padding: 12px;
    gap: 10px;
  }
  .masthead { align-items: flex-start; gap: 10px; }
  .eyebrow { font-size: 12.5px; letter-spacing: 0.13em; margin-bottom: 3px; }
  h1 { font-size: clamp(27px, 8vw, 34px); }
  .subtitle { font-size: 13.5px; max-width: 31em; }
  .tool { width: 38px; height: 38px; border-radius: 10px; }
  .tool svg { width: 18px; height: 18px; }
  .element-bar {
    display: block;
    padding: 9px;
    border-radius: 15px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .bar-head {
    width: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin: 0 1px 7px;
  }
  .bar-head h2 { font-size: 14px; }
  .bar-head p { margin: 0; font-size: 12.5px; }
  .element-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .element {
    height: 55px;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 5px 3px;
    border-radius: 10px;
    text-align: center;
  }
  .el-sym { width: 26px; height: 26px; border-radius: 7px; font-size: 13px; }
  .el-copy b { font-size: 13px; }
  .el-copy small { display: none; }
  .element.is-selected::after { top: 4px; right: 4px; width: 6px; height: 6px; box-shadow: none; }
  .lab-grid { display: flex; flex-direction: column; gap: 10px; }
  .stage-wrap { height: 54vh; min-height: 330px; border-radius: 18px; box-shadow: 5px 5px 0 var(--shadow); }
  .scene-label .tag { font-size: 14px; padding: 3px 7px 4px; border-width: 1.5px; border-radius: 6px; box-shadow: 2px 2px 0 rgba(36, 71, 63, 0.16); }
  .scene-label .tag small { font-size: 12.5px; }
  .stage-pill { top: 9px; left: 9px; padding: 5px 9px 6px; font-size: 12.5px; }
  .stage-status { left: 9px; bottom: 9px; max-width: 82%; padding: 6px 9px 7px; font-size: 12.5px; border-width: 1px; box-shadow: 2px 2px 0 rgba(120, 100, 68, 0.14); }
  .stage-hint { display: none; }
  .panel { overflow: visible; padding: 0; gap: 10px; }
  .actions { order: 1; }
  .obs-card { order: 2; padding: 13px; box-shadow: 4px 4px 0 var(--shadow); }
  .lab-note { order: 3; }
  .obs-title { font-size: 20px; }
  .obs-sub { font-size: 12.5px; }
  .status-pill { font-size: 12.5px; }
  .live-flame { margin-top: 9px; }
  .flame-name { font-size: 19px; }
  .fact { grid-template-columns: 82px minmax(0, 1fr); padding: 7px 1px; }
  .fact-value { font-size: 14px; }
  .equation { font-size: 12.5px; }
  .actions { grid-template-columns: minmax(0, 1fr) 92px; }
  .btn { height: 52px; }
  .btn-primary { font-size: 17px; }
  .btn-secondary { font-size: 14px; }
  .lab-note { font-size: 12.5px; }
}

@media (max-width: 430px) {
  .subtitle { font-size: 12.5px; }
  .stage-wrap { height: 50vh; min-height: 300px; }
  .scene-label .tag { font-size: 12.5px; }
  .scene-label .tag small { display: none; }
  .obs-title { font-size: 19px; }
  .flame-name { font-size: 18px; }
  .flame-hint { display: none; }
  .fact-value { font-size: 13.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

<body>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <div class="eyebrow">國中理化 · 燃燒與焰色觀察</div>
      <div class="title-row">
        <h1>焰色反應實驗室</h1>
      </div>
      <p class="subtitle">把元素放上<b>燃燒匙</b>，送進<b>暗室</b>裡的酒精燈火焰，觀察火焰顏色、煙霧與燃燒後的產物。</p>
    </div>
    <div class="tools">
      <button class="tool" id="fsBtn" type="button" aria-label="全螢幕" title="全螢幕">
        <svg class="expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/></svg>
        <svg class="shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
      </button>
    </div>
  </header>

  <section class="element-bar" aria-labelledby="elementsTitle">
    <div class="bar-head">
      <h2 id="elementsTitle">選擇元素</h2>
      <p>點一下，放上燃燒匙</p>
    </div>
    <div class="element-grid" id="elementGrid" role="group" aria-label="七種元素"></div>
  </section>

  <main class="lab-grid">
    <section class="stage-wrap" id="stageWrap" aria-label="3D 焰色反應實驗場景">
      <div id="stage"></div>
      <div class="flash-veil" id="flashVeil" aria-hidden="true"></div>
      <div class="stage-pill">暗室 · 酒精燈燃燒中</div>
      <svg class="leader-svg" id="leaderSvg" aria-hidden="true"></svg>
      <div class="stage-status" id="statusBadge" role="status" aria-live="polite">鈉已放上燃燒匙 · 按「開始燃燒」</div>
      <div class="stage-hint">拖曳旋轉 · 滾輪縮放</div>
    </section>

    <aside class="panel" aria-label="觀察與操作面板">
      <section class="obs-card" id="obsCard">
        <div class="obs-head">
          <div>
            <p class="obs-kicker">觀察紀錄</p>
            <h2 class="obs-title" id="obsTitle">尚未燃燒</h2>
            <p class="obs-sub" id="obsSub">鈉 Na · 銀白色軟金屬</p>
          </div>
          <span class="status-pill" id="statusPill">待機</span>
        </div>

        <div class="live-flame">
          <span class="flame-orb" id="flameOrb" aria-hidden="true"></span>
          <div class="flame-copy">
            <span class="row-label">火焰顏色</span>
            <strong class="flame-name" id="flameText">—</strong>
          </div>
          <span class="flame-hint" id="flameHint">燃燒後觀察</span>
        </div>

        <div class="fact-list">
          <div class="fact">
            <span class="fact-label">煙霧／現象</span>
            <span class="fact-value" id="smokeText">—</span>
          </div>
          <div class="fact">
            <span class="fact-label" id="productLabel">燃燒產物</span>
            <span class="fact-value" id="productText">—</span>
          </div>
          <div class="fact">
            <span class="fact-label">產物顏色</span>
            <span class="fact-value" id="colorText"><span class="color-mini" id="productSwatch" aria-hidden="true"></span><span id="colorLabel">—</span></span>
          </div>
        </div>

        <div class="equation" id="equation">選好元素，按「開始燃燒」</div>
      </section>

      <div class="actions">
        <button class="btn btn-primary" id="burnBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.2 2.2c.4 3.4-2.7 4.5-2.7 7.4 0 1.5 1 2.6 2.1 2.6 1.5 0 2.3-1.4 2-3.3 2.7 2 4.2 4.4 4.2 7.2 0 4-2.8 7-6.7 7-4.1 0-6.8-2.9-6.8-7 0-5.4 4.4-9.1 7.9-13.9Z"/></svg>
          <span id="burnLabel">開始燃燒</span>
        </button>
        <button class="btn btn-secondary" id="resetBtn" type="button">重置</button>
      </div>

      <p class="lab-note"><b>觀察重點：</b>火焰顏色和產物顏色不一定相同；銅只受熱、不起火；看不到氣體，也不代表沒有反應。</p>
    </aside>
  </main>
</div>

<div class="sr-only" id="ariaLive" role="status" aria-live="polite"></div>

  // --------------------------------------------------------------- utilities
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function smoothstep(a, b, x) {
    var t = clamp01((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) {
    t = clamp01(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // ------------------------------------------------------------- element UI
  function buildElementButtons() {
    ORDER.forEach(function (id) {
      var el = ELEMENTS[id];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "element";
      btn.dataset.element = id;
      btn.setAttribute("aria-label", "選擇" + el.name + "，" + el.appearance);
      btn.setAttribute("aria-pressed", id === currentId ? "true" : "false");
      btn.innerHTML =
        '<span class="el-sym" style="background:' + el.accent + ';color:' + el.accentInk + '">' +
        el.symbol + '</span><span class="el-copy"><b>' + el.name + '</b><small>' + el.appearance + '</small></span>';
      btn.addEventListener("click", function () { selectElement(id); });
      elementGrid.appendChild(btn);
      buttons[id] = btn;
    });
  }

  function setSelectedButton(id) {
    ORDER.forEach(function (key) {
      var on = key === id;
      var btn = buttons[key];
      if (!btn) return;
      btn.classList.toggle("is-selected", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function setPill(text, mode) {
    statusPill.textContent = text;

    var el = ELEMENTS[currentId];
    obsSub.textContent = el.name + " " + el.symbol + " · " + el.appearance;
    productLabel.textContent = isHeatOnly(el) ? "氧化產物" : "燃燒產物";

    if (mode === "idle") {
      if (state.running) {
        obsTitle.textContent = isHeatOnly(el) ? el.name + " 正在受熱" : el.name + " 正在放入火焰";
        setPill(isHeatOnly(el) ? "加熱中" : "燃燒中", "live");
        setOrb(null);
        flameText.textContent = isHeatOnly(el) ? "無火焰（只受熱）" : "加熱中…";
        flameHint.textContent = isHeatOnly(el) ? "只受熱" : "觀察中";
        smokeText.textContent = isHeatOnly(el) ? "銅片送入火焰中" : "燃燒匙下降中";
        productText.textContent = "—";
        colorText.textContent = isHeatOnly(el) ? "等待氧化" : "等待燃燒";
        productSwatch.className = "color-mini";
        productSwatch.style.background = "#e9e0ce";
        equation.textContent = isHeatOnly(el) ? "把銅片放進火焰上加熱…" : "把燃燒匙放進火焰…";
      } else {
        obsTitle.textContent = isHeatOnly(el) ? "尚未加熱" : "尚未燃燒";
        setPill("待機", "idle");
        setOrb(null);
        flameText.textContent = "—";
        flameHint.textContent = isHeatOnly(el) ? "加熱後觀察" : "燃燒後觀察";
        smokeText.textContent = "—";
        productText.textContent = "—";
        colorText.textContent = "—";
        productSwatch.className = "color-mini";
        productSwatch.style.background = "#f1e6d0";
        equation.textContent = "選好元素，按「" + startLabelFor(el) + "」";
      }
      obsCard.classList.remove("is-complete");
    } else if (mode === "live") {
      obsTitle.textContent = isHeatOnly(el) ? el.name + " 正在加熱" : el.name + " 正在燃燒";
      setPill(isHeatOnly(el) ? "加熱中" : "燃燒中", "live");
      setOrb(isHeatOnly(el) ? null : el.flameHex);
      flameText.textContent = isHeatOnly(el) ? "無火焰（只受熱）" : el.flame;
      flameHint.textContent = isHeatOnly(el) ? "只受熱" : "觀察中";
      smokeText.textContent = isHeatOnly(el) ? "銅表面逐漸氧化變黑" : "觀察煙霧與火焰…";
      productText.textContent = isHeatOnly(el) ? "氧化反應中…" : "燃燒中…";
      colorText.textContent = isHeatOnly(el) ? "等待氧化完成" : "等待燃燒完成";
      productSwatch.className = "color-mini";
      productSwatch.style.background = "#e9e0ce";
      equation.textContent = isHeatOnly(el) ? "2Cu + O₂ → 2CuO ｜ 只受熱，不起火" : "反應進行中…";
      obsCard.classList.remove("is-complete");
    } else if (mode === "complete") {
      obsTitle.textContent = isHeatOnly(el) ? el.name + " 加熱完成" : el.name + " 燃燒完成";
      setPill("已完成", "done");
      setOrb(isHeatOnly(el) ? null : el.flameHex);
      flameText.textContent = isHeatOnly(el) ? "無火焰（只受熱）" : el.flame;
      flameHint.textContent = isHeatOnly(el) ? "只受熱" : "已觀察";
      smokeText.textContent = el.smoke;
      productText.textContent = el.product;
      colorText.textContent = el.productColor;
      if (el.productHex) {
        productSwatch.className = "color-mini";
        productSwatch.style.background = el.productHex;
      } else {
        productSwatch.className = "color-mini is-invisible";
        productSwatch.style.background = "";
      }
      equation.textContent = el.equation;
      obsCard.classList.add("is-complete");
    }
    state.lastUiMode = mode;
  }

  function updateUiMode(force) {
    var mode = state.completed ? "complete" : (state.running && state.animTime > T_LOWER + 0.22 ? "live" : "idle");
    if (force || mode !== state.lastUiMode) paintObservation(mode);
  }

  function selectElement(id) {
    if (!ELEMENTS[id]) return;
    currentId = id;
    setSelectedButton(id);
    resetExperiment(true);
    sampleFlame.setColor(ELEMENTS[id].flameHex, ELEMENTS[id].glowHex);
    updateSpoonLabel();
    setStatus(ELEMENTS[id].name + " 已放上燃燒匙 · 按「" + startLabelFor(ELEMENTS[id]) + "」");
    updateUiMode(true);
  }

  function resetExperiment(keepStatus) {
    state.phase = "idle";
    state.animTime = 0;
    state.running = false;
    state.completed = false;
    state.useWallClock = false;
    state.flashStrength = 0;
    burnBtn.disabled = false;
    burnLabel.textContent = startLabelFor(ELEMENTS[currentId]);
    spoonGroup.position.y = SPOON_REST;
    armGroup.position.y = SPOON_REST;
    sampleFlame.group.visible = false;
    sampleFlame.group.scale.set(1, 1, 1);
    sampleFlame.light.intensity = 0;
    flash.visible = false;
    flash.material.opacity = 0;
    if (flashVeil) flashVeil.style.opacity = "0";
    renderer.toneMappingExposure = BASE_EXPOSURE;
    smokeAccum = 0;
    sparkAccum = 0;
    smoke.reset();
    sparks.reset();
    residueGroup.visible = false;
    residueGroup.scale.set(0.001, 0.001, 0.001);
    buildSample();
    startPlacement();
    paintObservation("idle");
    if (!keepStatus) setStatus(ELEMENTS[currentId].name + " 已放上燃燒匙 · 按「" + startLabelFor(ELEMENTS[currentId]) + "」");
    sampleLight.intensity = 0;
    spoonBowlMat.emissiveIntensity = 0;
    spoonHandleMat.emissiveIntensity = 0;
    flashLight.intensity = 0;
  }

  function phaseForTime(t) {
    if (t < T_LOWER) return "lowering";
    if (t < T_IGNITE_END) return "igniting";
    if (t < T_BURN_END) return "burning";
    if (t < T_FADE_END) return "finishing";
    if (t < T_END) return "lifting";
    return "done";
  }

  function startBurn() {
    if (state.running || burnBtn.disabled) return;
    if (state.phase !== "idle" || state.completed) resetExperiment(true);
    finishPlacement();
    state.running = true;
    state.completed = false;
    state.animTime = 0;
    state.phase = "lowering";
    state.startedAt = (typeof performance !== "undefined" ? performance.now() : Date.now());
    state.useWallClock = true;
    burnBtn.disabled = true;
    burnLabel.textContent = isHeatOnly(ELEMENTS[currentId]) ? "加熱中…" : "燃燒中…";
    setStatus(isHeatOnly(ELEMENTS[currentId]) ? "把銅片送進酒精燈火焰上加熱…" : "把燃燒匙放進火焰…");
    setPill(isHeatOnly(ELEMENTS[currentId]) ? "加熱中" : "燃燒中", "live");
    buildResidue();
    sampleFlame.group.visible = false;
    sampleFlame.group.scale.set(0.01, 0.01, 0.01);
    updateUiMode(true);
  }

  function onPhaseChange(phase, t) {
    var el = ELEMENTS[currentId];
    if (phase === "lowering") {
      setStatus(isHeatOnly(el) ? "把銅片送進酒精燈火焰上加熱…" : "把燃燒匙放進火焰…");
      burnLabel.textContent = isHeatOnly(el) ? "加熱中…" : "燃燒中…";
    } else if (phase === "igniting") {
      setStatus(isHeatOnly(el) ? "受熱中 · 銅不會起火，觀察表面變化" : "點燃中 · 觀察火焰顏色");
    } else if (phase === "burning") {
      if (isHeatOnly(el)) setStatus("加熱中 · 銅表面逐漸氧化成黑色氧化銅");
      else if (currentId === "p") setStatus("燃燒中 · 大量白煙生成");
      else if (currentId === "s") setStatus("燃燒中 · 藍紫色火焰，產物無色");
      else if (currentId === "c") setStatus("燃燒中 · 橘紅光與少量煙");
      else setStatus("燃燒中 · 觀察火焰顏色");
      updateUiMode(false);
    } else if (phase === "finishing") {
      setStatus(isHeatOnly(el)
        ? (state.completed ? "加熱完成 · 銅表面已變黑，準備觀察產物" : "銅表面變黑 · 觀察產物")
        : (state.completed ? "燃燒完成 · 火焰漸弱，觀察產物" : "火焰漸弱 · 觀察燃燒匙上的產物"));
    } else if (phase === "lifting") {
      setStatus(isHeatOnly(el)
        ? (state.completed ? "加熱完成 · 燃燒匙正在移出火焰" : "把燃燒匙移出火焰 · 準備觀察產物")
        : (state.completed ? "燃燒完成 · 燃燒匙正在移出火焰" : "把燃燒匙移出火焰 · 準備觀察產物"));
    }
  }

  function onComplete() {
    var el = ELEMENTS[currentId];
    state.completed = true;
    updateUiMode(true);
    burnBtn.disabled = true;
    burnLabel.textContent = "整理中…";
    if (isHeatOnly(el)) {
      setStatus("加熱完成 · 銅表面已氧化成黑色的氧化銅（CuO）");
    } else if (el.productHex === null) {
      setStatus("燃燒完成 · 產物是無色氣體，看不到");
    } else {
      setStatus("燃燒完成 · 看看燃燒匙上的" + el.productColor);
    }
  }

  function onDone() {
    var el = ELEMENTS[currentId];
    state.running = false;
    state.phase = "done";
    burnBtn.disabled = false;
    burnLabel.textContent = isHeatOnly(el) ? "再加熱一次" : "再燒一次";
    if (isHeatOnly(el)) {
      setStatus("加熱完成 · 產物：氧化銅（CuO），黑色粉末");
    } else if (el.productHex === null) {
      setStatus("燃燒完成 · " + el.product + "，無色看不到");
    } else {
      setStatus("燃燒完成 · 產物：" + el.product + "，" + el.productColor);
    }
  }

  // --------------------------------------------------------------- textures
  function makeCanvasTexture(w, h, draw) {
    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext("2d");
    draw(ctx, w, h);
    var tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  function makeGlowTexture() {
    return makeCanvasTexture(256, 256, function (ctx, w, h) {
      var g = ctx.createRadialGradient(w / 2, h / 2, 1, w / 2, h / 2, w / 2);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.22, "rgba(255,255,255,0.92)");
      g.addColorStop(0.52, "rgba(255,255,255,0.38)");
      g.addColorStop(0.8, "rgba(255,255,255,0.09)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
  }

  function makeSmokeTexture() {
    return makeCanvasTexture(192, 192, function (ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      var base = ctx.createRadialGradient(w / 2, h / 2, 6, w / 2, h / 2, w / 2);
      base.addColorStop(0, "rgba(255,255,255,0.5)");
      base.addColorStop(0.42, "rgba(255,255,255,0.28)");
      base.addColorStop(0.78, "rgba(255,255,255,0.08)");
      base.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      var blobs = [
        [-34, -22, 42, 0.22], [27, -34, 36, 0.18], [42, 18, 44, 0.2],
        [-20, 34, 38, 0.18], [-50, 8, 30, 0.13], [14, 12, 48, 0.24],
        [0, -50, 30, 0.12], [55, -8, 24, 0.12]
      ];
      for (var i = 0; i < blobs.length; i += 1) {
        var b = blobs[i];
        var g = ctx.createRadialGradient(w / 2 + b[0], h / 2 + b[1], 2, w / 2 + b[0], h / 2 + b[1], b[2]);
        g.addColorStop(0, "rgba(255,255,255," + b[3] + ")");
        g.addColorStop(0.58, "rgba(255,255,255," + (b[3] * 0.5) + ")");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }
    });
  }

  function makeWoodTexture() {
    var tex = makeCanvasTexture(512, 512, function (ctx, w, h) {
      ctx.fillStyle = "#5b402b";
      ctx.fillRect(0, 0, w, h);
      for (var i = 0; i < 46; i += 1) {
        var y = 10 + i * 11;
        ctx.beginPath();
        ctx.strokeStyle = i % 3 === 0 ? "rgba(28,17,10,0.28)" : "rgba(135,96,58,0.14)";
        ctx.lineWidth = i % 3 === 0 ? 1.6 : 1;
        for (var x = 0; x <= w; x += 16) {
          var yy = y + Math.sin(x * 0.021 + i * 1.7) * 3.2 + Math.sin(x * 0.007 + i) * 4.5;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      for (var k = 0; k < 10; k += 1) {
        ctx.beginPath();
        ctx.strokeStyle = "rgba(30,18,10,0.18)";
        ctx.lineWidth = 2;
        ctx.ellipse(60 + k * 47, 80 + (k % 4) * 110, 18 + (k % 3) * 9, 5 + (k % 2) * 2, 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(3, 2);
    return tex;
  }

      ctx.strokeRect(1, 1, w - 2, h - 2);
      ctx.beginPath();
      ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
      ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
      ctx.strokeStyle = "rgba(67,104,98,0.18)";
      ctx.stroke();
    });
    tex.wrapS = THREE.RepeatWrapping;

      ctx.strokeStyle = "rgba(238,239,211,0.12)";

      ctx.fillText("焰色反應", 63, 124);
      ctx.strokeStyle = "rgba(245,237,216,0.16)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(66, 156);

      ctx.fill();
      ctx.filter = "none";

  function standard(color, roughness, metalness) {
    return new THREE.MeshStandardMaterial({
      color: color,
      roughness: roughness === undefined ? 0.66 : roughness,

    });
  }

  function addBox(parent, w, h, d, material, x, y, z, cast, receive) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    m.position.set(x, y, z);
    m.castShadow = cast !== false;
    m.receiveShadow = receive !== false;
    parent.add(m);
    return m;
  }

  function roundedRectShape(w, h, r) {
    var s = new THREE.Shape();
    var x = -w / 2;
    var y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);
    s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);
    s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);
    s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);
    s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }

  function roundedSlab(w, d, h, r, material) {
    var shape = roundedRectShape(w, d, r);
    var geo = new THREE.ExtrudeGeometry(shape, {
      depth: h,
      bevelEnabled: true,
      bevelThickness: 0.14,
      bevelSize: 0.14,
      bevelSegments: 3,
      curveSegments: 20
    });
    geo.rotateX(-Math.PI / 2);
    geo.computeBoundingBox();
    geo.translate(0, -geo.boundingBox.max.y, 0);
    var mesh = new THREE.Mesh(geo, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function cylinderBetween(a, b, radius, material, segments) {
    var dir = new THREE.Vector3().subVectors(b, a);
    var len = dir.length();
    var geo = new THREE.CylinderGeometry(radius, radius, len, segments || 14);
    var m = new THREE.Mesh(geo, material);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

      new THREE.Vector2(1.68, -0.6),
      new THREE.Vector2(1.8, -0.13),
      new THREE.Vector2(1.82, 0.06)
    ];
    var bowl = new THREE.Mesh(new THREE.LatheGeometry(points, 40), spoonBowlMat);
    bowl.castShadow = true;
    bowl.receiveShadow = false;
    spoonGroup.add(bowl);
    var handle = cylinderBetween(new THREE.Vector3(1.65, 0.24, 0), new THREE.Vector3(4.15, 1.32, 0), 0.16, spoonHandleMat);
    spoonGroup.add(handle);
    var loop = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.09, 8, 24), spoonHandleMat);
    loop.rotation.y = Math.PI / 2;
    loop.position.set(4.48, 1.41, 0);
    spoonGroup.add(loop);

  }

  buildStand();

  // ---------------------------------------------------------------- samples
  function clearGroup(group) {
    while (group.children.length) {
      var child = group.children.pop();
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) child.material.forEach(function (m) { m.dispose(); });
        else child.material.dispose();
      }
    }
  }

  function makePowderMound(color, radius, height, material) {
    var geo = new THREE.IcosahedronGeometry(radius, 2);
    var pos = geo.attributes.position;
    var v = new THREE.Vector3();
    for (var i = 0; i < pos.count; i += 1) {
      v.fromBufferAttribute(pos, i);
      var n = 0.92 + 0.08 * Math.sin(v.x * 6.1 + i * 1.7) + 0.04 * Math.cos(v.z * 7.3 + i * 2.1);
      v.multiplyScalar(n);
      if (v.y < -0.08) v.y = -0.08 + (v.y + 0.08) * 0.25;
      pos.setXYZ(i, v.x, v.y * (height / radius), v.z);
    }
    geo.computeVertexNormals();
    var mesh = new THREE.Mesh(geo, material || standard(color, 1.0));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function startPlacement() {
    if (!sampleGroup || !sampleGroup.visible) return;
    if (reduceMotion) {
      finishPlacement();
      return;
    }
    state.placing = true;
    state.placeStart = (typeof performance !== "undefined" ? performance.now() : Date.now());
    sampleGroup.position.y = SAMPLE_BASE_Y + 2.4;
    sampleGroup.scale.set(0.22, 0.22, 0.22);
  }

  function finishPlacement() {
    state.placing = false;
    sampleGroup.position.y = SAMPLE_BASE_Y;
    sampleGroup.scale.set(1, 1, 1);
  }

  function updatePlacement() {
    if (!state.placing) return;
    var nowMs = (typeof performance !== "undefined" ? performance.now() : Date.now());
    var u = clamp01((nowMs - state.placeStart) / 430);
    var e = 1 - Math.pow(1 - u, 3);
    sampleGroup.position.y = SAMPLE_BASE_Y + (1 - e) * 2.4;
    var s = 0.22 + 0.78 * e;
    sampleGroup.scale.set(s, s, s);
    if (u >= 1) finishPlacement();
  }

  function buildSample() {
    clearGroup(sampleGroup);
    sampleMaterials = [];
    residueGroup.visible = false;
    residueGroup.scale.set(0.001, 0.001, 0.001);
    sampleGroup.visible = true;
    sampleGroup.scale.set(1, 1, 1);
    var el = ELEMENTS[currentId];

    function register(material) {
      sampleMaterials.push(material);
      return material;
    }

    if (currentId === "na" || currentId === "mg" || currentId === "zn" || currentId === "cu") {
      var metalColor = currentId === "cu" ? 0xd08250 : (currentId === "na" ? 0xeef4f5 : (currentId === "mg" ? 0xf8fbfb : 0xd3dfe1));
      var metalGlow = currentId === "cu" ? 0x5a2b16 : 0x667574;
      var metalMat = register(new THREE.MeshStandardMaterial({
        color: metalColor,
        roughness: 0.48,
        metalness: 0.08,
        emissive: metalGlow,
        emissiveIntensity: 0.38
      }));

      if (currentId === "mg" || currentId === "na") {
        var count = currentId === "mg" ? 3 : 3;
        for (var i = 0; i < count; i += 1) {
          var piece = new THREE.Mesh(new THREE.BoxGeometry(1.04, 0.2, 0.4), metalMat);
          piece.position.set((i - (count - 1) / 2) * 0.5, 0.46 + (i % 2) * 0.1, 0.06 * (i - 1));
          piece.rotation.set(0.12, i * 0.7, 0.1 * (i - 1));
          piece.castShadow = true;
          sampleGroup.add(piece);
        }
      } else if (currentId === "cu") {
        for (var c = 0; c < 4; c += 1) {
          var curl = new THREE.Mesh(new THREE.TorusGeometry(0.37, 0.085, 7, 16, Math.PI * 1.35), metalMat);
          curl.position.set((c - 1.5) * 0.4, 0.44, 0.04 * (c % 2));
          curl.rotation.set(1.2 + c * 0.1, c * 0.8, c * 0.35);
          curl.castShadow = true;
          sampleGroup.add(curl);
        }
      } else {
        for (var z = 0; z < 5; z += 1) {
          var grain = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3, 0), metalMat);
          grain.position.set((z - 2) * 0.35, 0.37 + (z % 2) * 0.11, 0.1 * (z % 3 - 1));
          grain.rotation.set(z, z * 0.7, 0);
          grain.castShadow = true;
          sampleGroup.add(grain);
        }
      }
    } else if (currentId === "s") {
      var sulfurMat = register(new THREE.MeshStandardMaterial({ color: 0xe4c33e, roughness: 0.96, metalness: 0.01 }));
      var sulfurMound = makePowderMound(0xe4c33e, 1.2, 0.54, sulfurMat);
      sulfurMound.position.y = 0.24;
      sampleGroup.add(sulfurMound);
      for (var s = 0; s < 5; s += 1) {
        var crumb = new THREE.Mesh(new THREE.DodecahedronGeometry(0.17, 0), sulfurMat);
        crumb.position.set((s - 2) * 0.33, 0.58, 0.14 * (s % 2 ? 1 : -1));
        sampleGroup.add(crumb);
      }
    } else if (currentId === "p") {
      var phosphorusMat = register(new THREE.MeshStandardMaterial({ color: 0x9e4338, roughness: 0.92, metalness: 0.01 }));
      var pm = makePowderMound(0x9e4338, 1.18, 0.52, phosphorusMat);
      pm.position.y = 0.24;
      sampleGroup.add(pm);
      for (var pp = 0; pp < 4; pp += 1) {
        var pchunk = new THREE.Mesh(new THREE.DodecahedronGeometry(0.17, 0), phosphorusMat);
        pchunk.position.set((pp - 1.5) * 0.36, 0.58, 0.12 * (pp % 2 ? 1 : -1));
        sampleGroup.add(pchunk);
      }
    } else if (currentId === "c") {
      var carbonMat = register(new THREE.MeshStandardMaterial({ color: 0x343a36, roughness: 0.9, metalness: 0.04 }));
      for (var cc = 0; cc < 3; cc += 1) {
        var chunk = new THREE.Mesh(new THREE.DodecahedronGeometry(0.48 - cc * 0.05, 0), carbonMat);
        chunk.position.set((cc - 1) * 0.5, 0.48, 0.08 * (cc % 2 ? 1 : -1));
        chunk.rotation.set(cc * 0.6, cc * 1.1, cc * 0.4);
        chunk.castShadow = true;
        sampleGroup.add(chunk);
      }
    }
  }

  function buildResidue() {
    clearGroup(residueGroup);
    var el = ELEMENTS[currentId];
    residueGroup.visible = false;
    residueGroup.scale.set(0.001, 0.001, 0.001);
    if (!el.residue) return;
    var material = new THREE.MeshStandardMaterial({ color: el.residue.color, roughness: 1.0, metalness: 0.01 });
    var mound = makePowderMound(el.residue.color, el.residue.radius, el.residue.height, material);
    mound.position.y = 0.06;
    residueGroup.add(mound);
    for (var i = 0; i < 5; i += 1) {
      var speck = new THREE.Mesh(new THREE.DodecahedronGeometry(0.09 + (i % 2) * 0.04, 0), material);
      speck.position.set(Math.sin(i * 2.1) * 0.8, 0.26, Math.cos(i * 1.7) * 0.62);
      residueGroup.add(speck);
    }
  }

  // ---------------------------------------------------------------- flames
  // The flame silhouette is a Blender-built mesh (four nested tongues in a GLB).
  // Three.js drives the vertex sway, flicker, colour, opacity and light so the
  // same geometry can become the lamp flame or any element's coloured flame.
  function makeFlameRig(baseColor, glowColor, isLamp) {
    var group = new THREE.Group();
    var layerGroup = new THREE.Group();
    var layers = [];
    var built = false;
    var tint = new THREE.Color(baseColor);
    var lightColor = new THREE.Color(glowColor);
    var white = new THREE.Color(0xffffff);
    var tintCore = tint.clone().lerp(white, 0.62);
    var baseHeight = isLamp ? 6.9 : 7.35;

    group.add(layerGroup);

    var glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex,
      color: lightColor,
      transparent: true,
      opacity: isLamp ? 0.22 : 0.3,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      toneMapped: false
    }));
    glow.scale.set(isLamp ? 5.6 : 7.4, isLamp ? 7.8 : 10.0, 1);
    glow.position.y = isLamp ? 3.1 : 3.5;
    glow.renderOrder = 11;
    group.add(glow);

    var baseGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex,
      color: tintCore,
      transparent: true,
      opacity: isLamp ? 0.2 : 0.24,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      toneMapped: false
    }));
    baseGlow.scale.set(isLamp ? 2.2 : 2.8, isLamp ? 3.2 : 4.2, 1);
    baseGlow.position.y = isLamp ? 1.15 : 1.3;
    baseGlow.renderOrder = 18;
    group.add(baseGlow);

    var light = new THREE.PointLight(lightColor, 0, isLamp ? 28 : 32, 2);
    light.position.y = isLamp ? 4.0 : 4.3;
    group.add(light);

    function applyColors() {
      tintCore.copy(tint).lerp(white, 0.62);
      layers.forEach(function (layer) {
        if (layer.isCore) layer.material.color.copy(tintCore);
        else if (layer.isSide) layer.material.color.copy(tint).lerp(white, 0.08);
        else layer.material.color.copy(tint);
      });
      glow.material.color.copy(lightColor);
      baseGlow.material.color.copy(tintCore);
      light.color.copy(lightColor);
    }

    function buildModel() {
      if (built || !flameAsset.root) return;
      var sourceMeshes = [];
      flameAsset.root.traverse(function (node) {
        if (node.isMesh) sourceMeshes.push(node);
      });
      sourceMeshes.forEach(function (source, index) {
        var name = source.name || "";
        var isCore = name.indexOf("core") >= 0;
        var isSide = name.indexOf("side") >= 0;
        var geometry = source.geometry.clone();
        var basePositions = Float32Array.from(geometry.attributes.position.array);
        var material = new THREE.MeshBasicMaterial({
          color: isCore ? tintCore.clone() : tint.clone(),
          transparent: true,
          opacity: isCore ? 0.82 : (isSide ? 0.46 : 0.66),
          depthWrite: false,
          side: THREE.DoubleSide,
          toneMapped: false,
          blending: isCore ? THREE.AdditiveBlending : THREE.NormalBlending
        });
        var mesh = new THREE.Mesh(geometry, material);
        mesh.position.copy(source.position);
        mesh.quaternion.copy(source.quaternion);
        mesh.scale.copy(source.scale);
        mesh.renderOrder = isCore ? 23 : (isSide ? 21 : 20);
        mesh.frustumCulled = false;
        mesh.userData.basePositions = basePositions;
        mesh.userData.phase = index * 1.71 + (isLamp ? 0.35 : 0);
        mesh.userData.isCore = isCore;
        mesh.userData.isSide = isSide;
        layerGroup.add(mesh);
        layers.push({
          mesh: mesh,
          material: material,
          isCore: isCore,
          isSide: isSide,
          baseOpacity: material.opacity,
          phase: mesh.userData.phase
        });
      });
      built = true;
      applyColors();
    }

    var rig = {
      group: group,
      layerGroup: layerGroup,
      layers: layers,
      glow: glow,
      baseGlow: baseGlow,
      light: light,
      isLamp: isLamp,
      baseHeight: baseHeight,
      isBuilt: function () { return built; },
      buildModel: buildModel
    };

    rig.setColor = function (hex, glowHex) {
      tint.set(hex);
      lightColor.set(glowHex);
      applyColors();
    };

    rig.update = function (time, intensity, scale, phase) {
      intensity = clamp01(intensity);
      if (intensity <= 0.001) {
        group.visible = false;
        light.intensity = 0;
        return;
      }
      group.visible = true;
      var s = baseHeight * (scale || 1);
      var flick = 1 + Math.sin(time * 12.7 + phase) * 0.026 + Math.sin(time * 20.3 + phase * 1.7) * 0.012;
      var widthFlick = 1 + Math.sin(time * 5.9 + phase * 0.7) * 0.022;
      group.scale.set(s * widthFlick, s * flick, s * widthFlick);
      group.rotation.z = Math.sin(time * 2.15 + phase) * 0.024;
      group.rotation.y = isLamp ? Math.sin(time * 1.3 + phase) * 0.12 : Math.sin(time * 1.8 + phase) * 0.18;

      for (var l = 0; l < layers.length; l += 1) {
        var layer = layers[l];
        var pos = layer.mesh.geometry.attributes.position;
        var base = layer.mesh.userData.basePositions;
        var amp = layer.isSide ? 1.35 : 1.0;
        for (var i = 0; i < pos.count; i += 1) {
          var i3 = i * 3;
          var x0 = base[i3];
          var y0 = base[i3 + 1];
          var z0 = base[i3 + 2];
          var h = Math.max(0, Math.min(1, y0));
          var bend = (
            Math.sin(time * 3.9 + phase + layer.phase + h * 4.6) * 0.032 +
            Math.sin(time * 7.2 + phase * 1.3 + h * 9.3) * 0.012
          ) * h * h * amp;
          pos.array[i3] = x0 + bend;
          pos.array[i3 + 1] = y0 * (1 + Math.sin(time * 10.8 + layer.phase + h * 3.0) * 0.022 * intensity);
          pos.array[i3 + 2] = z0 + Math.cos(time * 4.4 + phase + h * 5.4) * 0.016 * h * h * amp;
        }
        pos.needsUpdate = true;
        layer.material.opacity = layer.baseOpacity * intensity * (0.91 + 0.09 * Math.sin(time * 8.1 + layer.phase));
      }

      var pulse = 0.94 + 0.06 * Math.sin(time * 7.2 + phase);
      glow.material.opacity = (isLamp ? 0.22 : 0.3) * intensity * pulse;
      glow.scale.set((isLamp ? 5.6 : 7.4) * (0.96 + 0.06 * flick), (isLamp ? 7.8 : 10.0) * (0.96 + 0.06 * flick), 1);
      baseGlow.material.opacity = (isLamp ? 0.2 : 0.24) * intensity * (0.85 + 0.15 * pulse);
      baseGlow.scale.set((isLamp ? 2.2 : 2.8) * (0.94 + 0.1 * flick), (isLamp ? 3.2 : 4.2) * (0.94 + 0.1 * flick), 1);
      light.intensity = (isLamp ? 52 : 68) * intensity * (0.9 + 0.1 * flick);
    };

    group.visible = false;
    flameAsset.rigs.push(rig);
    return rig;
  }

  var lampFlame = makeFlameRig(0xffc052, 0xff9c2d, true);
  lampFlame.group.position.set(0, 8.15, 2);
  scene.add(lampFlame.group);

  var sampleFlame = makeFlameRig(0xffcf2f, 0xffc21a, false);
  sampleFlame.group.position.set(0, 0.05, 0);
  sampleFlame.group.scale.set(0.01, 0.01, 0.01);
  spoonGroup.add(sampleFlame.group);

  var flash = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex,
    color: 0xffffff,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    toneMapped: false
  }));
  flash.scale.set(12, 12, 1);
  flash.position.set(0, 16, 2);
  flash.visible = false;
  scene.add(flash);

  function decodeBase64(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function loadFlameAsset() {
    var glbTag = document.getElementById("island-glb");
    if (!glbTag || typeof THREE.GLTFLoader === "undefined") {
      flameAsset.status = "fallback";
      flameAsset.error = "Blender GLB or GLTFLoader unavailable";
      appReady = true;
      console.warn("[flame] " + flameAsset.error);
      return;
    }
    try {
      var loader = new THREE.GLTFLoader();
      var buffer = decodeBase64(glbTag.textContent.trim());
      loader.parse(buffer, "", function (gltf) {
        gltf.scene.updateMatrixWorld(true);
        flameAsset.root = gltf.scene;
        flameAsset.status = "ready";
        flameAsset.rigs.forEach(function (rig) { rig.buildModel(); });
        appReady = true;
        console.log("[flame] Blender flame asset ready · " + flameAsset.rigs.length + " rigs");
      }, function (error) {
        flameAsset.status = "fallback";
        flameAsset.error = String(error && error.message ? error.message : error);
        appReady = true;
        console.warn("[flame] GLB parse failed; using glow fallback: " + flameAsset.error);
      });
    } catch (error) {
      flameAsset.status = "fallback";
      flameAsset.error = String(error && error.message ? error.message : error);
      appReady = true;
      console.warn("[flame] GLB setup failed; using glow fallback: " + flameAsset.error);
    }
  }

  // --------------------------------------------------------------- particles
  function PuffSystem(max, blending, zIndex) {
    this.items = [];
    this.scene = scene;
    this.max = max;
    this.time = 0;
    for (var i = 0; i < max; i += 1) {
      var material = new THREE.SpriteMaterial({
        map: smokeTex,
        color: 0xffffff,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        blending: blending,
        toneMapped: false
      });
      var sprite = new THREE.Sprite(material);
      sprite.visible = false;
      sprite.renderOrder = zIndex;
      this.scene.add(sprite);
      this.items.push({
        sprite: sprite,
        material: material,
        life: 0,
        maxLife: 1,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        size: 1,
        grow: 1,
        alpha: 0.5,
        rot: 0,
        rotSpeed: 0
      });
    }
  }

  PuffSystem.prototype.reset = function () {
    for (var i = 0; i < this.items.length; i += 1) {
      this.items[i].life = 0;
      this.items[i].sprite.visible = false;
      this.items[i].material.opacity = 0;
    }
  };

  PuffSystem.prototype.spawn = function (pos, opts) {
    var item = null;
    for (var i = 0; i < this.items.length; i += 1) {
      if (!this.items[i].sprite.visible) { item = this.items[i]; break; }
    }
    if (!item) {
      var oldest = this.items[0];
      for (var k = 1; k < this.items.length; k += 1) {
        if (this.items[k].life > oldest.life) oldest = this.items[k];
      }
      item = oldest;
    }
    item.life = 0.0001;
    item.maxLife = opts.life;
    item.pos.copy(pos);
    item.vel.set(opts.vx || 0, opts.vy || 1, opts.vz || 0);
    item.size = opts.size;
    item.grow = opts.grow;
    item.alpha = opts.alpha;
    item.rot = Math.random() * Math.PI * 2;
    item.rotSpeed = (Math.random() - 0.5) * 1.1;
    item.material.color.setHex(opts.color);
    item.material.opacity = 0;
    item.sprite.visible = true;
    item.sprite.position.copy(pos);
    item.sprite.scale.set(item.size, item.size, 1);
    item.sprite.material.rotation = item.rot;
  };

  PuffSystem.prototype.update = function (dt) {
    this.time += dt;
    for (var i = 0; i < this.items.length; i += 1) {
      var item = this.items[i];
      if (!item.sprite.visible) continue;
      item.life += dt;
      var u = item.life / item.maxLife;
      if (u >= 1) {
        item.sprite.visible = false;
        item.material.opacity = 0;
        continue;
      }
      item.vel.y += 0.7 * dt;
      item.pos.x += item.vel.x * dt;
      item.pos.y += item.vel.y * dt;
      item.pos.z += item.vel.z * dt;
      item.sprite.position.copy(item.pos);
      var size = item.size + item.grow * u;
      item.sprite.scale.set(size, size, 1);
      item.rot += item.rotSpeed * dt;
      item.material.rotation = item.rot;
      item.material.opacity = item.alpha * smoothstep(0, 0.14, u) * Math.pow(1 - u, 1.45);
    }
  };

  var smoke = new PuffSystem(96, THREE.NormalBlending, 16);
  var sparks = new PuffSystem(34, THREE.AdditiveBlending, 17);

  var smokeAccum = 0;
  var sparkAccum = 0;

  function sampleWorldPosition(target) {
    return target.set(0, spoonGroup.position.y + 0.3, 2);
  }

  // --------------------------------------------------------------- animation
  function updateAnimation(dt) {
    if (!state.running) return;
    if (state.useWallClock) {
      var nowMs = (typeof performance !== "undefined" ? performance.now() : Date.now());
      state.animTime = (nowMs - state.startedAt) / 1000 * (reduceMotion ? 1.32 : 1);
    } else {
      state.animTime += dt * (reduceMotion ? 1.32 : 1);
    }
    var t = state.animTime;
    var phase = phaseForTime(t);

    if (phase !== state.phase) {
      state.phase = phase;
      if (phase === "done") {
        onDone();
      } else {
        onPhaseChange(phase, t);
      }
    }

    updateUiMode(false);

    if (!state.completed && t >= T_BURN_END) {
      state.completed = true;
      onComplete();
    }

    var spoonY;
    if (t < T_LOWER) {
      spoonY = lerp(SPOON_REST, SPOON_BURN, easeInOut(t / T_LOWER));
    } else if (t < T_FADE_END) {
      spoonY = SPOON_BURN;
    } else {
      spoonY = lerp(SPOON_BURN, SPOON_REST, easeInOut((t - T_FADE_END) / (T_LIFT_END - T_FADE_END)));
    }
    spoonGroup.position.y = spoonY;
    armGroup.position.y = spoonY;

    var igniteRamp = smoothstep(T_LOWER, T_LOWER + 0.6, t);
    var fadeRamp = 1 - smoothstep(T_BURN_END, T_FADE_END, t);
    var flameStrength = igniteRamp * fadeRamp;
    var burnProgress = smoothstep(T_LOWER + 0.05, T_BURN_END - 0.15, t);
    var residueProgress = smoothstep(T_BURN_END - 0.95, T_BURN_END - 0.05, t);
    var el = ELEMENTS[currentId];
    var heatOnly = isHeatOnly(el);

    var sampleScale = 1 - smoothstep(heatOnly ? 0.58 : 0.08, heatOnly ? 0.96 : 0.86, burnProgress);
    sampleGroup.visible = sampleScale > 0.02;
    sampleGroup.scale.set(Math.max(0.001, sampleScale), Math.max(0.001, sampleScale), Math.max(0.001, sampleScale));

    if (el.residue) {
      residueGroup.visible = residueProgress > 0.02;
      var rs = 0.001 + residueProgress * 0.999;
      residueGroup.scale.set(rs, rs, rs);
    } else {
      residueGroup.visible = false;
    }

    var activeFlame = flameStrength > 0.002 && !heatOnly;
    sampleFlame.group.visible = activeFlame;
    if (activeFlame) {
      var flick = 0.92 + 0.08 * Math.sin(simTime * 12.7) + 0.04 * Math.sin(simTime * 21.3 + 1.1);
      sampleFlame.update(simTime, flameStrength, el.flameScale * flick, 0.4);
    } else {
      sampleFlame.group.visible = false;
      sampleFlame.light.intensity = 0;
    }

    sampleLight.position.set(0, spoonY + 2.8, 2);
    sampleLight.intensity = heatOnly ? 0 : flameStrength * el.light * 0.64;
    sampleLight.color.set(el.glowHex);

    var flashU = (t - T_LOWER) / 0.85;
    var flashPulse = 0;
    if (flashU > 0 && flashU < 1) {
      flashPulse = Math.sin(Math.PI * clamp01(flashU)) * el.flash;
    }
    var isMagnesium = currentId === "mg";
    var flashStrength = flashPulse;
    if (isMagnesium) {
      // Magnesium keeps its intense white light for the whole burn, then
      // fades with the flame instead of dropping right after ignition.
      var mgRamp = smoothstep(T_LOWER, T_LOWER + 0.55, t);
      var mgFade = 1 - smoothstep(T_BURN_END, T_FADE_END, t);
      flashStrength = mgRamp * mgFade;
    }
    state.flashStrength = flashStrength;
    if (flashStrength > 0.01) {
      flash.visible = true;
      flash.position.set(0, spoonY + 2.4, 2);
      var fs = 10 + flashStrength * (isMagnesium ? 34 : 21);
      flash.scale.set(fs, fs, 1);
      flash.material.opacity = (isMagnesium ? 0.62 : 0.48) * flashStrength;
      flash.material.color.set(isMagnesium ? 0xffffff : el.glowHex);
      flashLight.position.set(0, spoonY + 2.2, 2);
      flashLight.color.set(isMagnesium ? 0xffffff : el.glowHex);
      flashLight.intensity = flashStrength * (isMagnesium ? 200 : 110);
      flashLight.distance = isMagnesium ? 46 : 34;
      if (flashVeil) {
        flashVeil.style.opacity = String(
          Math.min(0.92, flashStrength * (isMagnesium ? 0.34 : 0.16))
        );
      }
      renderer.toneMappingExposure = BASE_EXPOSURE + flashStrength * (isMagnesium ? 0.18 : 0.04);
    } else {
      flash.visible = false;
      flash.material.opacity = 0;
      flashLight.intensity = 0;
      if (flashVeil) flashVeil.style.opacity = "0";
      renderer.toneMappingExposure = BASE_EXPOSURE;
    }

    var heat = flameStrength * (0.35 + 0.65 * flameStrength);
    spoonBowlMat.emissive.set(el.flameHex);
    spoonBowlMat.emissiveIntensity = heat * 0.42;
    spoonHandleMat.emissive.set(el.flameHex);
    spoonHandleMat.emissiveIntensity = heat * 0.22;
    if (sampleMaterials.length) {
      if (heatOnly) {
        // Copper does not ignite: keep the alcohol-lamp flame, but let the
        // copper itself heat up and turn black as CuO forms.
        var oxidation = smoothstep(T_LOWER + 0.15, T_BURN_END - 0.15, t);
        for (var hm = 0; hm < sampleMaterials.length; hm += 1) {
          var hmat = sampleMaterials[hm];
          if (!hmat.userData.baseColor) hmat.userData.baseColor = hmat.color.clone();
          hmat.color.copy(hmat.userData.baseColor).lerp(OXIDE_BLACK, oxidation * 0.94);
          hmat.emissive.set(0xc75b24);
          hmat.emissiveIntensity = flameStrength * (0.24 - oxidation * 0.16);
          hmat.metalness = 0.08 * (1 - oxidation * 0.9);
          hmat.roughness = 0.56 + oxidation * 0.34;
        }
      } else {
        for (var sm = 0; sm < sampleMaterials.length; sm += 1) {
          sampleMaterials[sm].emissive.set(el.flameHex);
          sampleMaterials[sm].emissiveIntensity = flameStrength * 0.3;
        }
      }
    }

    // smoke
    var smokeRate = 0;
    if (el.smokeKind === "heavy") smokeRate = 22;
    else if (el.smokeKind === "low") smokeRate = 2.5;
    else if (el.smokeKind === "gray") smokeRate = 7;
    if (flameStrength > 0.12 && t > T_LOWER + 0.45) {
      smokeAccum += smokeRate * dt;
      while (smokeAccum >= 1) {
        smokeAccum -= 1;
        var heavy = el.smokeKind === "heavy";
        var smokeBase = heavy ? spoonY + 5.6 : spoonY + 2.6;
        var px = (Math.random() - 0.5) * (heavy ? 3.0 : 0.8);
        var p = new THREE.Vector3(
          px,
          smokeBase + Math.random() * (heavy ? 3.6 : 1.0),
          2 + (Math.random() - 0.5) * (heavy ? 3.0 : 0.6)
        );
        smoke.spawn(p, {
          life: heavy ? 2.5 + Math.random() * 1.2 : 1.4 + Math.random() * 0.8,
          size: heavy ? 3.4 + Math.random() * 2.2 : 0.9 + Math.random() * 0.6,
          grow: heavy ? 2.8 + Math.random() * 2.4 : 1.1,
          alpha: heavy ? 0.32 + Math.random() * 0.08 : 0.2,
          color: heavy ? 0xe8e6da : el.smokeColor,
          vx: heavy ? (px >= 0 ? 1 : -1) * (1.25 + Math.random() * 1.9) : (Math.random() - 0.5) * 0.5,
          vy: heavy ? 1.2 + Math.random() * 1.7 : 0.9 + Math.random() * 0.6,
          vz: (Math.random() - 0.5) * (heavy ? 2.4 : 0.4)
        });
      }
    } else {
      smokeAccum = 0;
    }

    var sparkRate = flameStrength > 0.2 && t > T_LOWER + 0.3 ? el.sparkRate : 0;
    if (sparkRate > 0) {
      sparkAccum += sparkRate * dt;
      while (sparkAccum >= 1) {
        sparkAccum -= 1;
        sparks.spawn(new THREE.Vector3(
          (Math.random() - 0.5) * 1.0,
          spoonY + 0.5 + Math.random() * 0.8,
          2 + (Math.random() - 0.5) * 0.7
        ), {
          life: 0.45 + Math.random() * 0.65,
          size: 0.14 + Math.random() * 0.28,
          grow: 0.25,
          alpha: 0.9,
          color: el.glowHex,
          vx: (Math.random() - 0.5) * 2.6,
          vy: 1.0 + Math.random() * 3.0,
          vz: (Math.random() - 0.5) * 1.8
        });
      }
    } else {
      sparkAccum = 0;
    }

    if (t >= T_END) {
      state.running = false;
      state.phase = "done";
      sampleFlame.group.visible = false;
      sampleLight.intensity = 0;
      spoonBowlMat.emissiveIntensity = 0;
      spoonHandleMat.emissiveIntensity = 0;
      flash.visible = false;
      flashLight.intensity = 0;
      if (flashVeil) flashVeil.style.opacity = "0";
      renderer.toneMappingExposure = BASE_EXPOSURE;
      spoonGroup.position.y = SPOON_REST;
      armGroup.position.y = SPOON_REST;
    }
  }

  // --------------------------------------------------------------- geometry projection / labels
  var labelDefs = [
    { id: "lamp", text: "酒精燈", sub: "熱源", dx: -146, dy: 62, anchor: function () { return new THREE.Vector3(2.8, 4.7, 2.9); } },
    { id: "spoon", text: "燃燒匙", sub: "目前：鈉 Na", dx: -168, dy: 46, anchor: function () { return new THREE.Vector3(0.1, spoonGroup.position.y + 0.4, 2); } }
  ];
  var labelEls = [];
  var spoonLabelSub = null;

  function buildLabels() {
    labelDefs.forEach(function (def) {
      var wrap = document.createElement("div");
      wrap.className = "scene-label label-" + def.id;
      wrap.innerHTML = '<span class="tag">' + def.text + '<small>' + def.sub + '</small></span>';
      stageWrap.appendChild(wrap);
      var line = document.createElementNS(NS, "line");
      line.setAttribute("stroke", "#dff0e7");
      line.setAttribute("stroke-width", "2.6");
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("opacity", "0.82");
      leaderSvg.appendChild(line);
      var dot = document.createElementNS(NS, "circle");
      dot.setAttribute("r", "4.2");
      dot.setAttribute("fill", "#eefaf4");
      dot.setAttribute("stroke", "#0a1716");
      dot.setAttribute("stroke-width", "2");
      leaderSvg.appendChild(dot);
      labelEls.push({ def: def, el: wrap, line: line, dot: dot });
    });
  }

  buildLabels();
  spoonLabelSub = document.querySelector(".label-spoon .tag small");

  function updateSpoonLabel() {
    if (!spoonLabelSub) return;
    var el = ELEMENTS[currentId];
    spoonLabelSub.textContent = "目前：" + el.name + " " + el.symbol;
  }

  var projected = new THREE.Vector3();
  function updateLabels() {
    var rect = stageWrap.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    var scale = Math.max(0.55, Math.min(1, rect.width / 960));
    for (var i = 0; i < labelEls.length; i += 1) {
      var item = labelEls[i];
      var anchor = item.def.anchor();
      projected.copy(anchor).project(camera);
      if (projected.z > 1) {
        item.el.style.display = "none";
        item.line.setAttribute("opacity", "0");
        item.dot.setAttribute("opacity", "0");
        continue;
      }
      item.el.style.display = "";
      item.line.setAttribute("opacity", "0.86");
      item.dot.setAttribute("opacity", "1");
      var ax = (projected.x * 0.5 + 0.5) * rect.width;
      var ay = (-projected.y * 0.5 + 0.5) * rect.height;
      var lx = ax + item.def.dx * scale;
      var ly = ay + item.def.dy * scale;
      var marginX = rect.width > 900 ? 64 : 40;
      var marginY = rect.width > 900 ? 48 : 28;
      lx = Math.max(marginX, Math.min(rect.width - marginX, lx));
      ly = Math.max(marginY, Math.min(rect.height - marginY, ly));
      item.el.style.left = lx + "px";
      item.el.style.top = ly + "px";
      item.line.setAttribute("x1", ax.toFixed(1));
      item.line.setAttribute("y1", ay.toFixed(1));
      item.line.setAttribute("x2", lx.toFixed(1));
      item.line.setAttribute("y2", ly.toFixed(1));
      item.dot.setAttribute("cx", ax.toFixed(1));
      item.dot.setAttribute("cy", ay.toFixed(1));
    }
  }

  // ------------------------------------------------------------------- camera
  function fitView() {
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    if (!w || !h) return;
    var narrow = w < 620;
    camera.fov = narrow ? 40 : 32;
    camera.updateProjectionMatrix();
    var aspect = w / h;
    var vFov = THREE.MathUtils.degToRad(camera.fov);
    var hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
    var neededWidth = narrow ? 38 : 52;
    var wanted = (neededWidth / 2) / Math.tan(hFov / 2) * 1.03;
    baseDistance = Math.max(narrow ? 46 : 60, Math.min(98, wanted));
    updateCamera();
  }

  function updateCamera() {
    var dist = baseDistance / zoom;
    var focusY = CAM_TARGET.y + (zoom - 1) * 5.4;
    var horizontal = Math.cos(pitch) * dist;
    camera.position.set(
      Math.sin(yaw) * horizontal,
      focusY + Math.sin(pitch) * dist,
      Math.cos(yaw) * horizontal
    );
    camera.lookAt(0, focusY, 0);
  }

  function resize() {
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    fitView();
  }

  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(resize).observe(stage);
  }
  window.addEventListener("resize", resize);

  // ------------------------------------------------------------- interaction
  var pointers = new Map();
  var dragging = false;
  var lastX = 0;
  var lastY = 0;
  var pinchDist = 0;
  var pinchZoom = 1;
  var canvas = renderer.domElement;

  function pointerGap() {
    var arr = Array.from(pointers.values());
    if (arr.length < 2) return 0;
    return Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
  }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.focus({ preventScroll: true });
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add("dragging");
    } else if (pointers.size === 2) {
      dragging = false;
      pinchDist = pointerGap();
      pinchZoom = zoom;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2) {
      var gap = pointerGap();
      if (pinchDist > 0 && gap > 0) {
        zoom = THREE.MathUtils.clamp(pinchZoom * (gap / pinchDist), 0.72, 1.75);
      }
      return;
    }
    if (!dragging) return;
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    yawTarget = THREE.MathUtils.clamp(yawTarget - dx * 0.0045, -0.72, 0.72);
    pitchTarget = THREE.MathUtils.clamp(pitchTarget + dy * 0.0026, 0.08, 0.62);
  });

  function removePointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) {
      pinchDist = 0;
      dragging = false;
      canvas.classList.remove("dragging");
    }
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  canvas.addEventListener("pointerup", removePointer);
  canvas.addEventListener("pointercancel", removePointer);
  canvas.addEventListener("pointerleave", function (e) {
    if (!canvas.hasPointerCapture(e.pointerId)) removePointer(e);
  });

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoom = THREE.MathUtils.clamp(zoom * (e.deltaY < 0 ? 1.08 : 0.925), 0.72, 1.75);
  }, { passive: false });

  canvas.addEventListener("dblclick", function () {
    yawTarget = 0.05;
    pitchTarget = 0.28;
    zoom = 1;
  });

  canvas.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { yawTarget = THREE.MathUtils.clamp(yawTarget + 0.07, -0.72, 0.72); e.preventDefault(); }
    if (e.key === "ArrowRight") { yawTarget = THREE.MathUtils.clamp(yawTarget - 0.07, -0.72, 0.72); e.preventDefault(); }
    if (e.key === "ArrowUp") { pitchTarget = THREE.MathUtils.clamp(pitchTarget - 0.04, 0.08, 0.62); e.preventDefault(); }
    if (e.key === "ArrowDown") { pitchTarget = THREE.MathUtils.clamp(pitchTarget + 0.04, 0.08, 0.62); e.preventDefault(); }
    if (e.key === "+" || e.key === "=") { zoom = THREE.MathUtils.clamp(zoom * 1.08, 0.72, 1.75); e.preventDefault(); }
    if (e.key === "-") { zoom = THREE.MathUtils.clamp(zoom / 1.08, 0.72, 1.75); e.preventDefault(); }
  });

  burnBtn.addEventListener("click", startBurn);
  resetBtn.addEventListener("click", function () {
    resetExperiment(false);
    setStatus("已重置 · 把燃燒匙放回原位");
    setPill("待機", "idle");
    ariaLive.textContent = "實驗已重置";
  });

  fsBtn.addEventListener("click", function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () { /* ignore */ });
    } else {
      document.exitFullscreen().catch(function () { /* ignore */ });
    }
  });

  document.addEventListener("fullscreenchange", function () {
    fsBtn.classList.toggle("is-full", !!document.fullscreenElement);
    fsBtn.setAttribute("aria-label", document.fullscreenElement ? "離開全螢幕" : "全螢幕");
    setTimeout(resize, 60);
  });

  // ---------------------------------------------------------------- QA hooks
  function getScreenBox() {
    var rect = stage.getBoundingClientRect();
    var boxes = [
      new THREE.Box3().setFromObject(bench),
      new THREE.Box3().setFromObject(lampGroup),
      new THREE.Box3().setFromObject(standPost),
      new THREE.Box3().setFromObject(armGroup),
      new THREE.Box3().setFromObject(spoonGroup)
    ];
    var minX = Infinity;
    var minY = Infinity;
    var maxX = -Infinity;
    var maxY = -Infinity;
    var v = new THREE.Vector3();
    boxes.forEach(function (box) {
      for (var xi = 0; xi < 2; xi += 1) {
        for (var yi = 0; yi < 2; yi += 1) {
          for (var zi = 0; zi < 2; zi += 1) {
            v.set(
              xi ? box.max.x : box.min.x,
              yi ? box.max.y : box.min.y,
              zi ? box.max.z : box.min.z
            ).project(camera);
            var sx = (v.x * 0.5 + 0.5) * rect.width + rect.left;
            var sy = (-v.y * 0.5 + 0.5) * rect.height + rect.top;
            sx = Math.max(rect.left, Math.min(rect.right, sx));
            sy = Math.max(rect.top, Math.min(rect.bottom, sy));
            if (sx < minX) minX = sx;
            if (sx > maxX) maxX = sx;
            if (sy < minY) minY = sy;
            if (sy > maxY) maxY = sy;
          }
        }
      }
    });
    if (!isFinite(minX)) {
      return { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height };
    }
    return {
      left: minX,
      top: minY,
      right: maxX,
      bottom: maxY,
      width: maxX - minX,
      height: maxY - minY
    };
  }

  window.__MODEL__ = {
    getState: function () {
      var el = ELEMENTS[currentId];
      return {
        ready: window.__APP_READY__ === true,
        selected: currentId,
        selectedName: el.name,
        phase: state.phase,
        running: state.running,
        completed: state.completed,
        animTime: Number(state.animTime.toFixed(2)),
        spoonY: Number(spoonGroup.position.y.toFixed(2)),
        flameColor: el.flame,
        flameHex: el.flameHex,
        hasFlame: el.hasFlame !== false,
        flameVisible: sampleFlame.group.visible,
        flashStrength: Number(state.flashStrength.toFixed(2)),
        smoke: el.smoke,
        product: el.product,
        productColor: el.productColor,
        equation: el.equation,
        sampleVisible: sampleGroup.visible,
        residueVisible: residueGroup.visible,
        flameAsset: flameAsset.status,
        blenderLayers: sampleFlame.layers.length,
        lampLayers: lampFlame.layers.length,
        activeSmoke: smoke.items.filter(function (item) { return item.sprite.visible; }).length,
        stage: {
          width: stage.clientWidth,
          height: stage.clientHeight
        },
        view: { yaw: Number(yaw.toFixed(3)), pitch: Number(pitch.toFixed(3)), zoom: Number(zoom.toFixed(2)) }
      };
    },
    selectElement: function (id) { selectElement(id); return this.getState(); },
    startBurn: function () { startBurn(); return this.getState(); },
    reset: function () { resetExperiment(false); return this.getState(); },
    finish: function () {
      if (!state.running) startBurn();
      state.useWallClock = false;
      state.completed = true;
      state.animTime = T_END;
      updateAnimation(0.016);
      return this.getState();
    },
    seek: function (seconds) {
      if (!state.running && state.phase !== "done") startBurn();
      state.useWallClock = false;
      state.animTime = Math.max(0, Number(seconds) || 0);
      updateAnimation(0.001);
      return this.getState();
    },
    setView: function (y, p) {
      yawTarget = Number(y) || 0;
      pitchTarget = THREE.MathUtils.clamp(Number(p) || 0.3, 0.08, 0.62);
      yaw = yawTarget;
      pitch = pitchTarget;
      updateCamera();
    },
    setZoom: function (z) { zoom = THREE.MathUtils.clamp(Number(z) || 1, 0.72, 1.75); updateCamera(); },
    resetView: function () { yawTarget = 0.05; pitchTarget = 0.28; zoom = 1; },
    getScreenBox: getScreenBox
  };

  // ---------------------------------------------------------------- startup
  buildElementButtons();
  setSelectedButton(currentId);
  buildSample();
  buildResidue();
  paintObservation("idle");
  updateUiMode(true);
  buildSample();
  updateSpoonLabel();
  sampleFlame.setColor(ELEMENTS[currentId].flameHex, ELEMENTS[currentId].glowHex);
  lampFlame.setColor(0xffc052, 0xff9c2d);
  resetExperiment(true);
  setStatus("鈉已放上燃燒匙 · 按「開始燃燒」");
  resize();
  loadFlameAsset();

  var clock = new THREE.Clock();
  function tick() {
    var dt = Math.min(clock.getDelta(), 0.12);
    simTime += dt;
    yaw += (yawTarget - yaw) * 0.12;
    pitch += (pitchTarget - pitch) * 0.12;
    updateCamera();
    updatePlacement();
    updateAnimation(dt);
    lampFlame.update(simTime, 1, 1, 0.2);
    smoke.update(dt);
    sparks.update(dt);
    updateLabels();
    renderer.render(scene, camera);
    if (appReady && window.__APP_READY__ !== true) window.__APP_READY__ = true;
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(function () {
    resize();
    tick();
  });
})();
</script>
</body>
</html>
